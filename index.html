const SORT_MODE_LABELS = { asc:'crescente ▲', desc:'decrescente ▼', peak:'più vicino al picco ★' };

function SortableMetricChart({title, paramKey, unit, color, rows, sortMode, onCycle}){
  let sorted;
  if(sortMode === 'peak'){
    sorted = rows.slice().sort((a,b) => b.pctPeak - a.pctPeak);
  } else if(sortMode === 'desc'){
    sorted = rows.slice().sort((a,b) => b.value - a.value);
  } else {
    sorted = rows.slice().sort((a,b) => a.value - b.value);
  }
  const avg = rows.length ? rows.reduce((a,r)=>a+r.value,0)/rows.length : 0;
  const chartData = sorted.map(r => ({label:r.name, value:+r.value.toFixed(2)}));

  return (
    <div className="card" style={{marginBottom:14}}>
      <div className="card-head" style={{cursor:'pointer'}} onClick={onCycle}>
        <div className="card-title"><InfoLabel paramKey={paramKey} label={title}/></div>
        <span style={{fontSize:11, color:'var(--lime)'}}>{SORT_MODE_LABELS[sortMode]} — clic per cambiare</span>
      </div>
      <BarChart2 data={chartData} xKey="label" unit={unit} height={170}
        series={[{key:'value', name:title, color}]}
        refLine={{value:avg, label:'Media squadra', color:'#E8A33D'}}/>
    </div>
  );
}

function SessionReportView(){
  const [teamSessions, setTeamSessions] = useState(null);
  const [error, setError] = useState(null);
  const [sessionIdx, setSessionIdx] = useState(null);
  const [sortModes, setSortModes] = useState({});

  React.useEffect(() => {
    loadTeamSessions().then(data => {
      setTeamSessions(data);
      setSessionIdx(data.length - 1);
    }).catch(e=>setError(e.message));
  }, []);

  if(error) return <ErrorState message={error}/>;
  if(teamSessions === null) return <LoadingState/>;
  if(teamSessions.length === 0) return <div className="empty-hint">Nessuna sessione trovata.</div>;

  const session = teamSessions[sessionIdx];
  const playerNames = Object.keys(session.players).sort();

  const cycleSort = (key) => {
    setSortModes(prev => {
      const cur = prev[key] || 'asc';
      const next = cur === 'asc' ? 'desc' : cur === 'desc' ? 'peak' : 'asc';
      return {...prev, [key]: next};
    });
  };

  const rowsFor = (metricKey) => playerNames.map(name => {
    const value = session.players[name][metricKey] || 0;
    const history = teamSessions.filter(s => s.players[name]).map(s => s.players[name][metricKey] || 0);
    const peak = history.length ? Math.max(...history) : 0;
    return { name, value, pctPeak: peak>0 ? (value/peak)*100 : 0 };
  });

  const teamAvg = (metricKey) => {
    const vals = playerNames.map(name => session.players[name][metricKey] || 0);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  };

  return (
    <div>
      <div className="controls" style={{marginBottom:16}}>
        <select value={sessionIdx} onChange={e=>setSessionIdx(Number(e.target.value))}>
          {teamSessions.map((s,i) => <option key={s.sessionId} value={i}>{s.label} — {s.fullLabel}</option>)}
        </select>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head"><div className="card-title">Analisi dati GPS — {session.fullLabel} ({session.label})</div></div>
        <table>
          <thead>
            <tr><th>Giocatore</th>{REPORT_METRICS.map(m => <th key={m.key}><InfoLabel paramKey={m.key} label={m.label}/></th>)}</tr>
          </thead>
          <tbody>
            <tr style={{background:'var(--pitch-200)', fontWeight:600}}>
              <td>Media squadra</td>
              {REPORT_METRICS.map(m => <td key={m.key} className="num">{fmt(teamAvg(m.key), m.dec)} {m.unit}</td>)}
            </tr>
            {playerNames.map(name => (
              <tr key={name}>
                <td>{name}</td>
                {REPORT_METRICS.map(m => <td key={m.key} className="num">{fmt(session.players[name][m.key]||0, m.dec)} {m.unit}</td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="grid grid-2">
      {REPORT_METRICS.map(m => (
        <SortableMetricChart key={m.key} title={m.label} paramKey={m.key} unit={m.unit} color={m.color}
          rows={rowsFor(m.key)} sortMode={sortModes[m.key]||'asc'} onCycle={()=>cycleSort(m.key)}/>
      ))}
      </div>
    </div>
  );
}

function ConfrontiAtletiView({teamSessions, selectedPlayers, metric, setMetric, sortDir, setSortDir, sessionIdx, setSessionIdx, compareBase, setCompareBase, m}){
  const session = teamSessions[sessionIdx];

  const rows = selectedPlayers
    .filter(name => session.players[name])
    .map(name => {
      const value = session.players[name][metric] || 0;
      const groupVals = selectedPlayers.filter(n => session.players[n]).map(n => session.players[n][metric] || 0);
      const groupAvg = groupVals.length ? groupVals.reduce((a,b)=>a+b,0)/groupVals.length : 0;
      const pctVsGroup = groupAvg > 0 ? (value/groupAvg)*100 : 0;
      const personalHistory = teamSessions.filter(s => s.players[name]).map(s => s.players[name][metric] || 0);
      const personalPeak = personalHistory.length ? Math.max(...personalHistory) : 0;
      const pctVsPeak = personalPeak > 0 ? (value/personalPeak)*100 : 0;
      const baseline = teamSessions.filter(s => s.sessionId !== session.sessionId && s.players[name] && (
        compareBase === 'match' ? s.isMatch : s.fullLabel === session.fullLabel
      )).map(s => s.players[name][metric] || 0);
      const baselineAvg = baseline.length ? baseline.reduce((a,b)=>a+b,0)/baseline.length : null;
      const pctVsBaseline = (baselineAvg && baselineAvg > 0) ? (value/baselineAvg)*100 : null;
      return { name, value, pctVsGroup, pctVsPeak, pctVsBaseline, hasBaseline: baseline.length > 0 };
    });
  rows.sort((a,b) => sortDir === 'desc' ? b.value - a.value : a.value - b.value);

  const trendData = teamSessions.map(s => {
    const row = {label: s.label};
    selectedPlayers.forEach(name => { row[name] = s.players[name] ? +(s.players[name][metric]||0).toFixed(m.dec) : null; });
    return row;
  });
  const palette = ['#A6E22E','#5FA8D3','#E8A33D','#9B8CE8','#E15B4E','#4FD3B8','#E8D53D','#D35FA8'];
  const trendSeries = selectedPlayers.map((name,i) => ({key:name, name, color: palette[i % palette.length]}));

  return (
    <React.Fragment>
      <div className="controls" style={{marginBottom:16}}>
        <select value={metric} onChange={e=>setMetric(e.target.value)}>
          {Object.entries(TEAM_METRICS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <select value={sessionIdx} onChange={e=>setSessionIdx(Number(e.target.value))}>
          {teamSessions.map((s,i) => <option key={s.sessionId} value={i}>{s.label} — {s.fullLabel}</option>)}
        </select>
        <select value={compareBase} onChange={e=>setCompareBase(e.target.value)}>
          <option value="session">K-Compare: stessa sessione (storico)</option>
          <option value="match">K-Compare: modello partita</option>
        </select>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head"><div className="card-title">Classifica — {m.label} · {session.label} ({session.fullLabel})</div></div>
        <table>
          <thead>
            <tr>
              <th>Giocatore</th>
              <th style={{cursor:'pointer'}} onClick={()=>setSortDir(d => d==='desc'?'asc':'desc')}>{m.label} {sortDir==='desc' ? '▼' : '▲'}</th>
              <th>% vs media gruppo</th>
              <th>% vs proprio picco</th>
              <th>{compareBase==='match' ? 'K-Compare vs partite' : 'K-Compare vs storico sessione'}</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.name}>
                <td>{r.name}</td>
                <td className="num">{fmt(r.value, m.dec)} {m.unit}</td>
                <td><span className={"badge " + pctBadgeClass(r.pctVsGroup)}>{fmt(r.pctVsGroup,0)}%</span></td>
                <td><span className={"badge " + pctBadgeClass(r.pctVsPeak)}>{fmt(r.pctVsPeak,0)}%</span></td>
                <td>{r.hasBaseline ? <span className={"badge " + pctBadgeClass(r.pctVsBaseline)}>{fmt(r.pctVsBaseline,0)}%</span> : <span style={{color:'var(--text-lo)', fontSize:12.5}}>storico insufficiente</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="section-note">Verde ≥110%, giallo 90–110%, rosso &lt;90% (come nel portale K-Sport).</div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">{m.label} nel tempo</div></div>
        <TrendChart data={trendData} xKey="label" unit={m.unit} series={trendSeries}/>
        <ChartLegend series={trendSeries}/>
      </div>
    </React.Fragment>
  );
}

  const [selectedPlayers, setSelectedPlayers] = useState([]);
  const [metric, setMetric] = useState('distance');
  const [selectedManualPlayers, setSelectedManualPlayers] = useState([]);
  const [manualStatName, setManualStatName] = useState('');
  const [manualStatsData, setManualStatsData] = useState({});

  React.useEffect(() => {
    loadTeamSessions().then(data => {
      setTeamSessions(data);
      setSelectedPlayers(Array.from(new Set(data.flatMap(s => Object.keys(s.players))))); // tutti di default
    }).catch(e=>setError(e.message));
    loadManualPlayers().then(setManualPlayers).catch(()=>{});
  }, []);

  React.useEffect(() => {
    if(mode !== 'manuali' || !manualPlayers) return;
    Promise.all(manualPlayers.map(p => loadManualStats(p.id).then(stats => [p.name, stats])))
      .then(entries => setManualStatsData(Object.fromEntries(entries)))
      .catch(e=>setError(e.message));
  }, [mode, manualPlayers]);

  if(error) return <ErrorState message={error}/>;

  const allStatNames = Array.from(new Set(Object.values(manualStatsData).flat().map(s=>s.stat_name)));

  return (
    <div>
      <div className="topbar">
        <div>
          <h1 className="page-title">Timeline</h1>
          <div className="page-sub">Andamento dei dati nel tempo</div>
        </div>
        <div className="controls">
          <button className={"pill-btn" + (mode==='ksport'?' on':'')} onClick={()=>setMode('ksport')} style={{cursor:'pointer'}}>Giocatori K-Sport</button>

        </div>
      </div>

      {mode === 'ksport' ? (
        teamSessions === null ? <LoadingState/> : teamSessions.length === 0 ? <div className="empty-hint">Nessun dato disponibile.</div> : (
          <React.Fragment>
            <div className="controls" style={{marginBottom:16}}>
              <select value={metric} onChange={e=>setMetric(e.target.value)}>
                {Object.entries(TEAM_METRICS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}

              {Array.from(new Set(teamSessions.flatMap(s => Object.keys(s.players)))).sort().map(name => (
                <button key={name} className={"chip" + (selectedPlayers.includes(name) ? " on":"")}
                  onClick={()=>setSelectedPlayers(sel => sel.includes(name) ? sel.filter(x=>x!==name) : [...sel, name])}>

              <TrendChart
                data={teamSessions.map(s => {
                  const row = {label:s.label};
                  selectedPlayers.forEach(name => { row[name] = s.players[name] ? +(s.players[name][metric]||0).toFixed(TEAM_METRICS[metric].dec) : null; });
                  return row;
                })}
                xKey="label" unit={TEAM_METRICS[metric].unit}
                series={selectedPlayers.map((name,i) => ({key:name, name, color: ['#A6E22E','#5FA8D3','#E8A33D','#9B8CE8','#E15B4E','#4FD3B8','#E8D53D','#D35FA8'][i%8]}))}
              />
            </div>
          </React.Fragment>
        )
      ) : (
        manualPlayers === null ? <LoadingState/> :
        manualPlayers.length === 0 ? <div className="empty-hint">Nessun giocatore manuale ancora creato.</div> :
        allStatNames.length === 0 ? <div className="empty-hint">Nessuna statistica manuale registrata ancora.</div> :
        (
          <React.Fragment>
            <div className="controls" style={{marginBottom:16}}>
              <select value={manualStatName} onChange={e=>setManualStatName(e.target.value)}>
                <option value="">Seleziona una statistica…</option>
                {allStatNames.map(n => <option key={n} value={n}>{n}</option>)}
              </select>
            </div>
            <div className="chip-row" style={{marginBottom:18}}>
              {manualPlayers.map(p => (
                <button key={p.id} className={"chip" + (selectedManualPlayers.includes(p.name) ? " on":"")}

                  {p.name}
                </button>
              ))}
            </div>
            {!manualStatName || selectedManualPlayers.length===0 ? <div className="empty-hint">Seleziona una statistica e almeno un giocatore.</div> : (
              <div className="card">
                <div className="card-head"><div className="card-title">{manualStatName} nel tempo</div></div>
                {(() => {
                  const dates = Array.from(new Set(
                    selectedManualPlayers.flatMap(name => (manualStatsData[name]||[])
                      .filter(s=>s.stat_name===manualStatName && s.recorded_date)
                      .map(s=>s.recorded_date))
                  )).sort();
                  const data = dates.map(d => {
                    const row = {label: new Date(d).toLocaleDateString('it-IT')};
                    selectedManualPlayers.forEach(name => {
                      const entry = (manualStatsData[name]||[]).find(s=>s.stat_name===manualStatName && s.recorded_date===d);
                      row[name] = entry ? parseFloat(entry.stat_value) : null;
                    });
                    return row;
                  });
                  const series = selectedManualPlayers.map((name,i) => ({key:name, name, color: ['#A6E22E','#5FA8D3','#E8A33D','#9B8CE8','#E15B4E','#4FD3B8'][i%6]}));
                  return data.length === 0 ? <div className="empty-hint">Nessuna data registrata per questa statistica.</div> : (
                    <React.Fragment><TrendChart data={data} xKey="label" unit="" series={series}/><ChartLegend series={series}/></React.Fragment>
                  );
                })()}
              </div>
            )}
          </React.Fragment>
        )
      )}
    </div>
  );
}

function youtubeEmbedUrl(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{6,15})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

/* Confronta i picchi GPS in allenamento (non partita) PRIMA dell'infortunio
   con il massimo raggiunto DA quando è iniziato l'infortunio in poi —
   verde se il giocatore è tornato al livello pre-infortunio, rosso altrimenti. */
function GpsRecoveryPanel({playerName, injury}){
  const [sessions, setSessions] = useState(null);
  const [error, setError] = useState(null);

  React.useEffect(() => {
    setSessions(null);
    loadPlayerSessions(playerName.toLowerCase()).then(setSessions).catch(e=>setError(e.message));
  }, [playerName]);

  if(!injury.injury_date) return <div className="empty-hint">Imposta una data infortunio per vedere il confronto GPS.</div>;
  if(error) return <ErrorState message={error}/>;
  if(sessions === null) return <div className="empty-hint">Caricamento dati GPS…</div>;

  const injuryUnix = new Date(injury.injury_date).getTime()/1000;
  const training = sessions.filter(s => !s.isMatch);
  const before = training.filter(s => s.dateUnix < injuryUnix);
  const after = training.filter(s => s.dateUnix >= injuryUnix);

  return (
    <div style={{display:'flex', flexDirection:'column', gap:8}}>
      {REPORT_METRICS.map(m => {
        const preVals = before.map(s => s[m.key]||0);
        const postVals = after.map(s => s[m.key]||0);
        const preInjuryPeak = preVals.length ? Math.max(...preVals) : 0;
        const postInjuryBest = postVals.length ? Math.max(...postVals) : 0;
        const pct = preInjuryPeak > 0 ? (postInjuryBest/preInjuryPeak)*100 : null;
        const reached = pct !== null && pct >= 100;
        return (
          <div key={m.key} title={pct!==null ? `${fmtNum(pct,0)}% del picco pre-infortunio (${fmt(postInjuryBest,m.dec)} / ${fmt(preInjuryPeak,m.dec)} ${m.unit})` : 'Dati insufficienti'}
            style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'7px 4px', borderBottom:'1px solid var(--pitch-100)', cursor:'help'}}>
            <InfoLabel paramKey={m.key} label={m.label} style={{fontSize:12}}/>
            <div style={{display:'flex', alignItems:'center', gap:8}}>
              <span style={{fontSize:11, color:'var(--text-lo)'}}>{pct!==null ? `${fmtNum(pct,0)}%` : '—'}</span>
              <span style={{width:12, height:12, borderRadius:'50%', display:'inline-block', background: pct===null ? 'var(--text-lo)' : (reached ? '#A6E22E' : '#E15B4E')}}></span>
            </div>
          </div>
        );
      })}
      <div className="section-note" style={{marginTop:4}}>Confronto tra il picco raggiunto in allenamento prima dell'infortunio e il massimo raggiunto da allora. Passa il mouse su una riga per il dettaglio.</div>
    </div>
  );
}

  const [generating, setGenerating] = useState(null);
  const [reportModal, setReportModal] = useState(null); // {title, content}
  const [editingZone, setEditingZone] = useState(false);
  const [editingDays, setEditingDays] = useState(false);
  const [daysDraft, setDaysDraft] = useState(injury.days_out || '');

  const refresh = () => {
    loadDocuments(playerName).then(all => setDocs(all.filter(d => d.injury_id === injury.id))).catch(e=>setError(e.message));
    loadRehabTests(playerName).then(all => setTests(all.filter(t => t.injury_id === injury.id))).catch(e=>setError(e.message));
  };
  React.useEffect(() => { refresh(); setDaysDraft(injury.days_out || ''); }, [playerName, injury.id]);

  const handleUpload = async (e) => {
    e.preventDefault();
    if(!file) return;
    setUploading(true);
    try{
      const fileBase64 = await fileToBase64(file);
      const extractedText = isExcelFile(file) ? await excelFileToCsv(file).catch(()=>null) : null;
      await uploadDocument({ playerName, docType, title: docTitle.trim(), fileBase64, fileName: file.name, mimeType: file.type, injuryId: injury.id, extractedText });
      setDocTitle(''); setFile(null);
      refresh();
    } catch(err){ setError(err.message); }
    setUploading(false);
  };
  const handleDeleteDoc = async (id) => { try{ await deleteDocument(id); refresh(); } catch(err){ setError(err.message); } };
  const handleConsultoDoc = async (d) => {
    if(d.ai_summary){ setReportModal({title:d.title||'Documento', content:d.ai_summary}); return; }
    setAnalyzing(d.id);
    try{
      const res = await analyzeDocument(d.id);
      await refresh();
      setReportModal({title:d.title||'Documento', content:res.summary || 'Nessuna sintesi disponibile.'});
    } catch(err){ setError(err.message); }
    setAnalyzing(null);
  };

  const handleUploadTestDoc = async (e) => {
    e.preventDefault();
    if(!testFile) return;
    setUploadingTestDoc(true);
    try{
      const fileBase64 = await fileToBase64(testFile);
      const extractedText = isExcelFile(testFile) ? await excelFileToCsv(testFile).catch(()=>null) : null;
      await uploadDocument({ playerName, docType:'test_riabilitativo', title: testDocTitle.trim(), fileBase64, fileName: testFile.name, mimeType: testFile.type, injuryId: injury.id, extractedText });
      setTestDocTitle(''); setTestFile(null);
      refresh();
    } catch(err){ setError(err.message); }
    setUploadingTestDoc(false);
  };

  const handleAddTest = async (e) => {
    e.preventDefault();
    if(!testName.trim() || !testValue.trim()) return;
    try{
      await addRehabTest({ playerName, testName:testName.trim(), value:testValue.trim(), unit:testUnit.trim(), testDate: testDate||null, injuryId: injury.id });
      setTestName(''); setTestValue(''); setTestUnit(''); setTestDate('');
      refresh();
    } catch(err){ setError(err.message); }
  };
  const handleDeleteTest = async (id) => { try{ await deleteRehabTest(id); refresh(); } catch(err){ setError(err.message); } };
  const [editingTestId, setEditingTestId] = useState(null);
  const [testEditDraft, setTestEditDraft] = useState({});
  const startEditTest = (t) => { setEditingTestId(t.id); setTestEditDraft({value:t.value, unit:t.unit||'', notes:t.notes||''}); };
  const handleSaveTestEdit = async () => {
    try{ await updateRehabTest(editingTestId, testEditDraft); setEditingTestId(null); refresh(); } catch(err){ setError(err.message); }
  };
  const handleConsultoTest = async (t) => {
    if(t.ai_comment){ setReportModal({title:t.test_name, content:t.ai_comment}); return; }
    setGenerating(t.id);
    try{
      const res = await generateAiComment({ testId:t.id, playerName, testName:t.test_name, value:t.value, unit:t.unit, notes:t.notes });
      await refresh();
      setReportModal({title:t.test_name, content:res.comment || 'Nessun commento disponibile.'});
    } catch(err){ setError(err.message); }
    setGenerating(null);
  };

  const handleZoneSelect = async (zoneId) => {
    try{ await updateInjury(injury.id, { bodyZone: zoneId }); if(onUpdated) onUpdated(); } catch(err){ setError(err.message); }
  };
  const handleSaveDays = async () => {
    try{ await updateInjury(injury.id, { daysOut: daysDraft }); setEditingDays(false); if(onUpdated) onUpdated(); } catch(err){ setError(err.message); }
  };

  const elapsedDays = injury.injury_date ? Math.floor((Date.now() - new Date(injury.injury_date).getTime())/86400000) : 0;
  const totalDays = injury.days_out || 0;
  const progressPct = totalDays > 0 ? Math.min(100, Math.max(0, (elapsedDays/totalDays)*100)) : 0;
  const examDocs = docs ? docs.filter(d => d.doc_type !== 'test_riabilitativo') : [];
  const testDocs = docs ? docs.filter(d => d.doc_type === 'test_riabilitativo') : [];

  return (
    <div style={{padding:'14px', background:'var(--pitch-000)', borderRadius:8, marginTop:8}}>
      {error && <div className="section-note" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
      {reportModal && <AiReportModal title={reportModal.title} content={reportModal.content} onClose={()=>setReportModal(null)}/>}

      <div style={{display:'grid', gridTemplateColumns:'1fr 1.4fr', gap:16, marginBottom:16, alignItems:'start'}}>
        {/* Colonna sinistra: localizzazione infortunio */}
        <div className="card">
          <div className="card-head">
            <div className="card-title">Localizzazione</div>
            <button onClick={()=>setEditingZone(e=>!e)} className="pill-btn" style={{cursor:'pointer', fontSize:10.5}}>{editingZone ? 'Fatto' : '✎'}</button>
          </div>
          <BodySilhouette selectedZone={injury.body_zone} onSelect={handleZoneSelect} editable={editingZone} height={260} injuryType={injury.injury_type}/>
        </div>

        {/* Colonna destra: documenti caricati (diagnosi & esami + test) */}
        <div style={{display:'flex', flexDirection:'column', gap:16}}>
          <div className="card">
            <div className="card-head"><div className="card-title">Diagnosi & esami</div></div>
            <form onSubmit={handleUpload} style={{display:'flex', gap:8, marginBottom:12, flexWrap:'wrap', alignItems:'center'}}>
              <select value={docType} onChange={e=>setDocType(e.target.value)} style={{fontSize:12}}>
                {DOC_TYPES.filter(t=>t.value!=='test_riabilitativo').map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
              </select>
              <input placeholder="Titolo (opzionale)" value={docTitle} onChange={e=>setDocTitle(e.target.value)}
                style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12, flex:1, minWidth:120}}/>
              <input type="file" accept="application/pdf,image/*,.xlsx,.xls,.csv" onChange={e=>setFile(e.target.files[0]||null)} style={{fontSize:12}}/>
              <button type="submit" disabled={!file || uploading} className="pill-btn on" style={{cursor:'pointer', fontSize:12}}>
                {uploading ? 'Caricamento…' : 'Carica'}
              </button>
            </form>
            {docs === null ? <div className="empty-hint">Caricamento…</div> :
             examDocs.length === 0 ? <div className="empty-hint">Nessun documento per questo infortunio.</div> :
             <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px, 1fr))', gap:10}}>
               {examDocs.map(d => (
                 <div key={d.id} className="doc-tile-3d" style={{display:'flex', gap:12, padding:'12px'}}>
                   <DocOpener d={d} onDocUpdated={refresh}><DocIcon mimeType={d.mime_type} large/></DocOpener>
                   <div style={{flex:1, minWidth:0}}>
                     <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                       <DocOpener d={d} onDocUpdated={refresh} style={{color:'var(--lime)', fontSize:12.5, textDecoration:'none', fontWeight:600}}>{d.title || 'Documento'}</DocOpener>
                       <button onClick={()=>handleDeleteDoc(d.id)} style={{background:'transparent', border:'none', color:'var(--red)', fontSize:11, cursor:'pointer'}}>✕</button>
                     </div>
                     <div style={{fontSize:10.5, color:'var(--text-lo)', marginTop:2}}>{DOC_TYPES.find(t=>t.value===d.doc_type)?.label || d.doc_type}</div>
                     <button onClick={()=>handleConsultoDoc(d)} disabled={analyzing===d.id} className="pill-btn" style={{marginTop:8, cursor:'pointer', fontSize:10.5}}>
                       {analyzing===d.id ? 'Analisi…' : 'Consulto IA'}
                     </button>
                   </div>
                 </div>
               ))}
             </div>
            }
          </div>

          <div className="card">
            <div className="card-head"><div className="card-title">Referti test</div></div>
            <form onSubmit={handleUploadTestDoc} style={{display:'flex', gap:8, marginBottom:12, flexWrap:'wrap', alignItems:'center'}}>
              <input placeholder="Titolo (opzionale)" value={testDocTitle} onChange={e=>setTestDocTitle(e.target.value)}
                style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12, flex:1, minWidth:120}}/>
              <input type="file" accept="application/pdf,image/*,.xlsx,.xls,.csv" onChange={e=>setTestFile(e.target.files[0]||null)} style={{fontSize:12}}/>
              <button type="submit" disabled={!testFile || uploadingTestDoc} className="pill-btn on" style={{cursor:'pointer', fontSize:12}}>
                {uploadingTestDoc ? 'Caricamento…' : 'Carica'}
              </button>
            </form>
            <div className="section-note" style={{marginBottom:10}}>Per un Excel: salvalo prima come PDF e carica quello.</div>
            {testDocs.length === 0 ? <div className="empty-hint">Nessun referto caricato.</div> :
             <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px, 1fr))', gap:10}}>
               {testDocs.map(d => (
                 <div key={d.id} className="doc-tile-3d" style={{display:'flex', gap:12, padding:'12px'}}>
                   <DocOpener d={d} onDocUpdated={refresh}><DocIcon mimeType={d.mime_type} large/></DocOpener>
                   <div style={{flex:1, minWidth:0}}>
                     <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                       <DocOpener d={d} onDocUpdated={refresh} style={{color:'var(--lime)', fontSize:12.5, textDecoration:'none', fontWeight:600}}>{d.title || 'Referto'}</DocOpener>
                       <button onClick={()=>handleDeleteDoc(d.id)} style={{background:'transparent', border:'none', color:'var(--red)', fontSize:11, cursor:'pointer'}}>✕</button>
                     </div>
                     <button onClick={()=>handleConsultoDoc(d)} disabled={analyzing===d.id} className="pill-btn" style={{marginTop:8, cursor:'pointer', fontSize:10.5}}>
                       {analyzing===d.id ? 'Analisi…' : 'Consulto IA'}
                     </button>
                   </div>
                 </div>
               ))}
             </div>
            }
          </div>
        </div>
      </div>

      {/* Timeline orizzontale, a tutta larghezza, sotto sagoma e documenti */}
      <div className="card-3d" style={{marginBottom:16}}>
        <div className="card-head"><div className="card-title">Prognosi & timeline</div></div>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24, alignItems:'start'}}>
          <div>
            {editingDays ? (
              <div style={{display:'flex', gap:6, alignItems:'center', marginBottom:14}}>
                <input type="number" min="0" value={daysDraft} onChange={e=>setDaysDraft(e.target.value)}
                  style={{width:70, background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 8px', borderRadius:6, fontSize:12.5}}/>
                <span style={{fontSize:11.5, color:'var(--text-lo)'}}>giorni</span>
                <button onClick={handleSaveDays} className="pill-btn on" style={{cursor:'pointer', fontSize:11}}>Salva</button>
              </div>
            ) : (
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14}}>
                <span style={{fontSize:13}}>Prognosi: <b className="num" style={{fontSize:16}}>{totalDays || '—'}</b> giorni</span>
                <button onClick={()=>setEditingDays(true)} className="pill-btn" style={{cursor:'pointer', fontSize:10.5}}>✎ Modifica</button>
              </div>
            )}
            <div style={{background:'var(--pitch-100)', borderRadius:20, height:18, overflow:'hidden', marginBottom:8, boxShadow:'inset 0 2px 6px rgba(0,0,0,0.5)'}}>
              <div style={{width:`${progressPct}%`, height:'100%', background: progressPct>=100 ? 'linear-gradient(90deg,#7CB82E,#A6E22E)' : 'linear-gradient(90deg,#3E7AA8,#5FA8D3)', transition:'width .3s', boxShadow:'0 0 10px rgba(166,226,46,0.4)'}}></div>
            </div>
            <div style={{fontSize:12, color:'var(--text-lo)'}}>{elapsedDays} / {totalDays || '?'} giorni trascorsi {progressPct>=100 ? '— prognosi completata' : ''}</div>
          </div>
          <div>
            <div className="card-title" style={{marginBottom:8}}>Recupero picchi GPS (allenamento)</div>
            <GpsRecoveryPanel playerName={playerName} injury={injury}/>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Test riabilitativi</div></div>
          <form onSubmit={handleAddTest} style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:6, marginBottom:10}}>
            <input placeholder="Nome test" value={testName} onChange={e=>setTestName(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12, gridColumn:'1 / 3'}}/>
            <input placeholder="Valore" value={testValue} onChange={e=>setTestValue(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12}}/>
            <input placeholder="Unità" value={testUnit} onChange={e=>setTestUnit(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12}}/>
            <input type="date" value={testDate} onChange={e=>setTestDate(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12, gridColumn:'1 / 3'}}/>
            <button type="submit" className="pill-btn on" style={{gridColumn:'1 / 3', cursor:'pointer', fontSize:12}}>Aggiungi test</button>
          </form>
          {tests === null ? <div className="empty-hint">Caricamento…</div> :
           tests.length === 0 ? <div className="empty-hint">Nessun test per questo infortunio.</div> :
           <div style={{display:'flex', flexDirection:'column', gap:6}}>
             {tests.map(t => (
               <div key={t.id} style={{padding:'7px 9px', background:'var(--pitch-100)', borderRadius:6}}>
                 {editingTestId === t.id ? (
                   <div>
                     <div style={{fontSize:12, fontWeight:600, marginBottom:6}}>{t.test_name}</div>
                     <div style={{display:'flex', gap:6, marginBottom:6, flexWrap:'wrap'}}>
                       <input value={testEditDraft.value} onChange={e=>setTestEditDraft(d=>({...d, value:e.target.value}))} placeholder="Valore"
                         style={{width:80, background:'var(--pitch-000)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'5px 7px', borderRadius:5, fontSize:11.5}}/>
                       <input value={testEditDraft.unit} onChange={e=>setTestEditDraft(d=>({...d, unit:e.target.value}))} placeholder="Unità"
                         style={{width:60, background:'var(--pitch-000)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'5px 7px', borderRadius:5, fontSize:11.5}}/>
                     </div>
                     <textarea value={testEditDraft.notes} onChange={e=>setTestEditDraft(d=>({...d, notes:e.target.value}))} placeholder="Note"
                       style={{width:'100%', minHeight:44, background:'var(--pitch-000)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 8px', borderRadius:5, fontSize:11.5, marginBottom:6, resize:'vertical'}}/>
                     <div style={{display:'flex', gap:6}}>
                       <button onClick={handleSaveTestEdit} className="pill-btn on" style={{cursor:'pointer', fontSize:11}}>Salva</button>
                       <button onClick={()=>setEditingTestId(null)} className="pill-btn" style={{cursor:'pointer', fontSize:11}}>Annulla</button>
                     </div>
                   </div>
                 ) : (
                   <React.Fragment>
                     <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                       <span style={{fontSize:12}}>{t.test_name} <span className="num">{t.value} {t.unit}</span></span>
                       <div style={{display:'flex', gap:8}}>
                         <button onClick={()=>startEditTest(t)} style={{background:'transparent', border:'none', color:'var(--lime)', fontSize:11, cursor:'pointer'}}>✎</button>
                         <button onClick={()=>handleDeleteTest(t.id)} style={{background:'transparent', border:'none', color:'var(--red)', fontSize:11, cursor:'pointer'}}>✕</button>
                       </div>
                     </div>
                     {t.notes && <div style={{color:'var(--text-lo)', fontSize:11, marginTop:4}}>{t.notes}</div>}
                     <button onClick={()=>handleConsultoTest(t)} disabled={generating===t.id} className="pill-btn" style={{marginTop:6, cursor:'pointer', fontSize:10.5}}>
                       {generating===t.id ? 'Generazione…' : 'Consulto IA'}
                     </button>
                   </React.Fragment>
                 )}
               </div>
             ))}
           </div>
          }
      </div>
    </div>
  );
}

function InjuryLogPanel({playerName}){
  const { t } = useT();
  const [injuries, setInjuries] = useState(null);
  const [error, setError] = useState(null);
  const [showAddForm, setShowAddForm] = useState(false);
  const [injuryType, setInjuryType] = useState(INJURY_TYPES[0]);
  const [bodyPart, setBodyPart] = useState('');
  const [bodyZone, setBodyZone] = useState(null);
  const [injuryDate, setInjuryDate] = useState('');
  const [daysOut, setDaysOut] = useState('');
  const [notes, setNotes] = useState('');
  const [selectedId, setSelectedId] = useState(null);

  const refresh = (keepSelection) => loadPlayerInjuries(playerName).then(list => {
    setInjuries(list);
    const chronological = [...list].sort((a,b) => new Date(a.injury_date||0) - new Date(b.injury_date||0));
    if(!keepSelection){
      setSelectedId(chronological.length ? chronological[chronological.length-1].id : null);
    }
  }).catch(e=>setError(e.message));
  React.useEffect(() => { refresh(false); }, [playerName]);

  const handleAdd = async (e) => {
    e.preventDefault();
    try{
      const created = await addInjury({ playerName, injuryType, bodyPart:bodyPart.trim(), bodyZone, injuryDate: injuryDate||null, daysOut: daysOut||null, notes:notes.trim() });
      setBodyPart(''); setBodyZone(null); setInjuryDate(''); setDaysOut(''); setNotes(''); setShowAddForm(false);
      await refresh(true);
      if(created && created.Injury) setSelectedId(created.Injury.id);
    } catch(err){ setError(err.message); }
  };
  const handleDelete = async (id) => {
    try{ await deleteInjury(id); refresh(false); } catch(err){ setError(err.message); }
  };

  const chronological = injuries ? [...injuries].sort((a,b) => new Date(a.injury_date||0) - new Date(b.injury_date||0)) : [];
  const selected = chronological.find(i => i.id === selectedId);

  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">{t('storico_infortuni')}</div>
        <button onClick={()=>setShowAddForm(s=>!s)} className="pill-btn on" style={{cursor:'pointer'}}>{showAddForm ? 'Annulla' : t('nuovo_infortunio')}</button>
      </div>
      {error && <div className="section-note" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}

      {showAddForm && (
        <div className="grid grid-2" style={{marginBottom:16}}>
          <BodySilhouette selectedZone={bodyZone} onSelect={setBodyZone} editable height={260} injuryType={injuryType}/>
          <form onSubmit={handleAdd} style={{display:'flex', flexDirection:'column', gap:8}}>
            <select value={injuryType} onChange={e=>setInjuryType(e.target.value)} style={{fontSize:12.5}}>
              {INJURY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <input placeholder="Dettaglio zona (es. bicipite femorale)" value={bodyPart} onChange={e=>setBodyPart(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'7px 10px', borderRadius:6, fontSize:12.5}}/>
            <input type="date" value={injuryDate} onChange={e=>setInjuryDate(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'7px 10px', borderRadius:6, fontSize:12.5}}/>
            <input type="number" min="0" placeholder="Giorni di stop (numero, es. 180)" value={daysOut} onChange={e=>setDaysOut(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'7px 10px', borderRadius:6, fontSize:12.5}}/>
            <input placeholder="Note (opzionale)" value={notes} onChange={e=>setNotes(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'7px 10px', borderRadius:6, fontSize:12.5}}/>
            <button type="submit" className="pill-btn on" style={{cursor:'pointer'}}>Salva infortunio</button>
          </form>
        </div>
      )}

      {injuries === null ? <div className="empty-hint">Caricamento…</div> :
       injuries.length === 0 ? <div className="empty-hint">Nessun infortunio registrato.</div> :
       <React.Fragment>
         <div className="chip-row" style={{marginBottom:6}}>
           {chronological.map(inj => (
             <button key={inj.id} className={"chip" + (selectedId===inj.id ? " on":"")} onClick={()=>setSelectedId(inj.id)}>
               {inj.injury_date ? new Date(inj.injury_date).toLocaleDateString('it-IT') : '—'} · {inj.injury_type}
             </button>
           ))}
         </div>
         {selected && (
           <React.Fragment>
             <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:6}}>
               <span style={{fontSize:12.5, color:'var(--text-lo)'}}>
                 {selected.body_part || zoneLabel(selected.body_zone) || ''} {selected.notes ? '· ' + selected.notes : ''}
               </span>
               <button onClick={()=>handleDelete(selected.id)} style={{background:'transparent', border:'none', color:'var(--red)', fontSize:11.5, cursor:'pointer'}}>Elimina infortunio</button>
             </div>
             <InjuryScreen playerName={playerName} injury={selected} onUpdated={()=>refresh(true)}/>
           </React.Fragment>
         )}
       </React.Fragment>
      }
    </div>
  );
}

function AreaMedicaPage({initialPlayer}){
  const { t } = useT();
  const [scope, setScope] = useState(initialPlayer ? 'giocatore' : 'squadra');
  const [teamInjuries, setTeamInjuries] = useState(null);
  const [error, setError] = useState(null);
  const [players, setPlayers] = useState(null);
  const [statusByPlayer, setStatusByPlayer] = useState({});
  const [selectedName, setSelectedName] = useState(initialPlayer || '');
  const [physioLink, setPhysioLink] = useState(null);
  const [physioCopied, setPhysioCopied] = useState(false);

  const handleGeneratePhysioLink = async () => {
    try{
      const token = await getStaffToken('fisioterapista');
      setPhysioLink(`${window.location.origin}${window.location.pathname}?fisio=${token}`);
    } catch(err){ setError(err.message); }
  };
  const handleCopyPhysioLink = () => {
    navigator.clipboard.writeText(physioLink);
    setPhysioCopied(true);
    setTimeout(()=>setPhysioCopied(false), 2000);
  };

  React.useEffect(() => {
    if(scope !== 'squadra' || teamInjuries !== null) return;

const KEY_LIFTS = ['Bench Press', 'Squat', 'Deadlift', 'Power Clean', 'STOH', 'Hip Thrust'];

function PersonalRecordsPanel({data}){
  const allExercises = [...data.current.exercises, ...data.history.flatMap(s => s.exercises)];
  const maxFor = (liftName) => {
    const matches = allExercises.filter(ex => (ex.exercise_name||'').toLowerCase().includes(liftName.toLowerCase()));
    const kgs = matches.map(ex => Number(ex.kg)).filter(v => !isNaN(v) && v > 0);
    return kgs.length ? Math.max(...kgs) : null;
  };
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">Massimali esercizi fondamentali</div></div>
      <div>
        {KEY_LIFTS.map(lift => {
          const max = maxFor(lift);
          return (
            <div key={lift} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 4px', borderBottom:'1px solid var(--pitch-100)'}}>
              <span style={{fontSize:12.5}}>{lift}</span>
              <span className="num" style={{fontSize:13, color: max ? 'var(--text-hi)' : 'var(--text-lo)'}}>{max ? `${fmt(max,1)} kg` : '—'}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PlayerGymSheetPanel({playerName}){
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [openHistoryId, setOpenHistoryId] = useState(null);
  const [editingDates, setEditingDates] = useState(false);
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [shareLink, setShareLink] = useState(null);
  const [copied, setCopied] = useState(false);

  const handleShare = async () => {
    try{
      const token = await getAthleteToken(playerName);
      const link = `${window.location.origin}${window.location.pathname}?atleta=${token}`;
      setShareLink(link);
    } catch(err){ setError(err.message); }
  };
  const handleCopy = () => {
    navigator.clipboard.writeText(shareLink);
    setCopied(true);
    setTimeout(()=>setCopied(false), 2000);
  };

  const refresh = () => loadGymSheets(playerName).then(d => {
    setData(d);
    setStartDate(d.current.start_date ? d.current.start_date.slice(0,10) : '');
    setEndDate(d.current.end_date ? d.current.end_date.slice(0,10) : '');
  }).catch(e=>setError(e.message));
  React.useEffect(() => { setData(null); setShareLink(null); refresh(); }, [playerName]);

  const handleNewSheet = async () => {
    try{ await createNewSheet(playerName); refresh(); } catch(err){ setError(err.message); }
  };
  const handleDeleteExercise = async (id) => {
    try{ await deleteExercise(id); refresh(); } catch(err){ setError(err.message); }
  };
  const handleUpdateExercise = async (id, draft) => {
    try{ await updateExercise(id, draft); refresh(); } catch(err){ setError(err.message); }
  };
  const handleDeleteSheet = async (id) => {
    try{ await deleteSheet(id); refresh(); } catch(err){ setError(err.message); }
  };
  const handleSaveDates = async () => {
    try{ await updateSheet(data.current.id, { startDate: startDate||null, endDate: endDate||null }); setEditingDates(false); refresh(); } catch(err){ setError(err.message); }
  };

  if(error) return <ErrorState message={error}/>;
  if(data === null) return <LoadingState/>;

  return (
    <div>
      <div className="card" style={{marginBottom:16}}>
        <div className="card-head"><div className="card-title">Link personale per l'atleta</div></div>
        <div className="section-note" style={{marginBottom:10}}>
          Da questo link, {playerName} può vedere tutti i propri dati (Performance, Area Medica, scheda Strength) e modificare SOLO i Kg della propria scheda corrente — nient'altro è modificabile, nemmeno dal link stesso.
        </div>
        {!shareLink ? (
          <button onClick={handleShare} className="pill-btn on" style={{cursor:'pointer'}}>Genera link per {playerName}</button>
        ) : (
          <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
            <input readOnly value={shareLink} onClick={e=>e.target.select()}
              style={{flex:1, minWidth:260, background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'7px 10px', borderRadius:6, fontSize:12}}/>
            <button onClick={handleCopy} className="pill-btn" style={{cursor:'pointer'}}>{copied ? 'Copiato ✓' : 'Copia'}</button>
          </div>
        )}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'260px 1fr', gap:16, alignItems:'start'}}>
      {/* Colonna sinistra: storico schede + massimali sotto, sempre visibili senza scorrere */}
      <div style={{display:'flex', flexDirection:'column', gap:16}}>
      <div className="card">
        <div className="card-head"><div className="card-title">Schede precedenti ({data.history.length})</div></div>
        {data.history.length === 0 ? <div className="empty-hint">Nessuna scheda precedente.</div> : (
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {data.history.map(sheet => (
              <div key={sheet.id} className="card" style={{background:'var(--pitch-100)', padding:'10px 12px'}}>
                <div style={{cursor:'pointer'}} onClick={()=>setOpenHistoryId(openHistoryId===sheet.id?null:sheet.id)}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <b style={{fontSize:12.5}}>{sheet.title}</b>
                    <span style={{fontSize:10.5, color:'var(--text-lo)'}}>{openHistoryId===sheet.id ? '▲' : '▼'}</span>
                  </div>
                  <div style={{color:'var(--text-lo)', fontSize:11, marginTop:3}}>
                    {sheet.start_date ? new Date(sheet.start_date).toLocaleDateString('it-IT') : '—'}
                    {' → '}
                    {sheet.end_date ? new Date(sheet.end_date).toLocaleDateString('it-IT') : 'in corso'}
                  </div>
                  <div style={{color:'var(--text-lo)', fontSize:11}}>{sheet.exercises.length} esercizi</div>
                </div>
                {openHistoryId===sheet.id && (
                  <React.Fragment>
                    <div style={{marginTop:8, overflowX:'auto'}}><ExerciseTable exercises={sheet.exercises} editable={false}/></div>
                    <button onClick={()=>handleDeleteSheet(sheet.id)} style={{background:'transparent', border:'none', color:'var(--red)', fontSize:11, cursor:'pointer', marginTop:6}}>Elimina scheda</button>
                  </React.Fragment>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
      <PersonalRecordsPanel data={data}/>
      </div>

      {/* Colonna destra: scheda corrente, in primo piano */}
      <div className="card" style={{borderColor:'var(--lime)'}}>
        <div className="card-head">
          <div className="card-title">Scheda corrente — {data.current.title}</div>
          <button onClick={handleNewSheet} className="pill-btn" style={{cursor:'pointer'}}>+ Nuova scheda</button>
        </div>

        <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:14, flexWrap:'wrap'}}>
          {editingDates ? (
            <React.Fragment>
              <span style={{fontSize:12, color:'var(--text-lo)'}}>Da</span>
              <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}
                style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12.5}}/>
              <span style={{fontSize:12, color:'var(--text-lo)'}}>a</span>
              <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)}
                style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12.5}}/>
              <button onClick={handleSaveDates} className="pill-btn on" style={{cursor:'pointer', fontSize:12}}>Salva</button>
              <button onClick={()=>setEditingDates(false)} className="pill-btn" style={{cursor:'pointer', fontSize:12}}>Annulla</button>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <span style={{fontSize:12.5, color:'var(--text-lo)'}}>
                Periodo: {startDate ? new Date(startDate).toLocaleDateString('it-IT') : '—'} → {endDate ? new Date(endDate).toLocaleDateString('it-IT') : 'in corso'}
              </span>
              <button onClick={()=>setEditingDates(true)} className="pill-btn" style={{cursor:'pointer', fontSize:11.5}}>✎ Modifica periodo</button>
            </React.Fragment>
          )}
        </div>

        <ExerciseForm sheetId={data.current.id} onAdded={refresh}/>
        <ExerciseTable exercises={data.current.exercises} onDeleted={handleDeleteExercise} onUpdated={handleUpdateExercise} editable/>
      </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){ console.error('Errore nella pagina:', error, info); }
  render(){
    if(this.state.error){
      return (
        <div className="card" style={{borderColor:'var(--red)'}}>
          <div className="card-title" style={{color:'var(--red)', marginBottom:8}}>Si è verificato un errore in questa pagina</div>
          <div className="section-note" style={{color:'var(--text-hi)'}}>{String(this.state.error.message || this.state.error)}</div>
          <div className="section-note">Prova a cambiare pagina e tornare indietro, oppure ricarica il sito.</div>
        </div>
      );
    }
    return this.props.children;
  }
}

                  {sheet.exercises.length === 0 ? <div className="empty-hint">Nessun esercizio in questa scheda.</div> : (
                    <table>
                      <thead><tr><th>Esercizio</th><th>Video</th><th>Kg</th><th>Reps</th><th>Recupero</th><th>Note</th></tr></thead>
                      <tbody>
                        {sheet.exercises.map(ex => (
                          <AthleteExerciseRow key={ex.id} ex={ex} onSave={handleKgChange} saving={savingId===ex.id}/>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function AthleteMedicalView({playerName}){
  const [tests, setTests] = useState(null);
  const [docs, setDocs] = useState(null);
  const [injuries, setInjuries] = useState(null);
  const [error, setError] = useState(null);

  React.useEffect(() => {
    loadRehabTests(playerName).then(setTests).catch(e=>setError(e.message));
    loadDocuments(playerName).then(setDocs).catch(e=>setError(e.message));
    loadPlayerInjuries(playerName).then(setInjuries).catch(e=>setError(e.message));
  }, [playerName]);

  if(error) return <ErrorState message={error}/>;

  return (
    <div>
      <div className="card" style={{marginBottom:16}}>
        <div className="card-head"><div className="card-title">Test e valutazioni</div></div>
        {tests===null ? <LoadingState/> : tests.length===0 ? <div className="empty-hint">Nessun test registrato.</div> : (
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {tests.map(t => (
              <div key={t.id} style={{padding:'9px 10px', background:'var(--pitch-100)', borderRadius:6}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                  <div>
                    <b style={{fontSize:13}}>{t.test_name}</b>
                    <span className="num" style={{fontSize:12.5, marginLeft:8}}>{t.value} {t.unit}</span>
                  </div>
                  <span style={{color:'var(--text-lo)', fontSize:11}}>{t.test_date ? new Date(t.test_date).toLocaleDateString('it-IT') : ''}</span>
                </div>
                {t.notes && <div style={{color:'var(--text-lo)', fontSize:11.5, marginTop:4}}>{t.notes}</div>}
                {t.ai_comment && (
                  <div className="section-note" style={{marginTop:8, padding:9, background:'var(--pitch-200)', borderRadius:6}}>
                    <b style={{color:'var(--lime)'}}>Commento AI:</b> {t.ai_comment}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head"><div className="card-title">Documenti</div></div>
        {docs===null ? <LoadingState/> : docs.length===0 ? <div className="empty-hint">Nessun documento.</div> : (
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px, 1fr))', gap:10}}>
            {docs.map(d => (
              <a key={d.id} href={`/api/documents?id=${d.id}&download=1`} target="_blank" rel="noreferrer"
                className="doc-tile-3d" style={{display:'flex', gap:12, padding:'12px', textDecoration:'none', color:'inherit'}}>
                <DocIcon mimeType={d.mime_type} large/>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{color:'var(--lime)', fontSize:12.5, fontWeight:600}}>{d.title || 'Documento'}</div>
                  <div style={{color:'var(--text-lo)', fontSize:11, marginTop:2}}>{new Date(d.uploaded_at).toLocaleDateString('it-IT')}</div>
                  <div style={{color:'var(--text-lo)', fontSize:10.5, marginTop:4}}>Apri in una pagina a parte ↗</div>
                  {d.ai_summary && <div className="section-note" style={{marginTop:6}}>{d.ai_summary}</div>}
                </div>
              </a>
            ))}
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Storico infortuni</div></div>
        {injuries===null ? <LoadingState/> : injuries.length===0 ? <div className="empty-hint">Nessun infortunio registrato.</div> : (
          <table>
            <thead><tr><th>Tipo</th><th>Zona</th><th>Data</th><th>Giorni stop</th></tr></thead>
            <tbody>
              {injuries.map(i => (
                <tr key={i.id}>
                  <td>{i.injury_type}</td>
                  <td style={{color:'var(--text-lo)'}}>{i.body_part || '—'}</td>
                  <td style={{color:'var(--text-lo)'}}>{i.injury_date ? new Date(i.injury_date).toLocaleDateString('it-IT') : '—'}</td>
                  <td className="num">{i.days_out || '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function AthleteView({token}){
  const [playerName, setPlayerName] = useState(null);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState('performance');
  const [sessions, setSessions] = useState(null);
  const [playerTab, setPlayerTab] = useState('panoramica');

  React.useEffect(() => {
    resolveAthleteToken(token).then(setPlayerName).catch(e=>setError(e.message));
  }, [token]);

  React.useEffect(() => {
    if(!playerName) return;
    loadPlayerSessions(playerName.toLowerCase()).then(setSessions).catch(e=>setError(e.message));
  }, [playerName]);

  if(error) return <div style={{padding:40}}><ErrorState message={error}/></div>;
  if(playerName === null) return <div style={{padding:40}}><LoadingState/></div>;

  return (
    <div className="app">
      <div className="sidebar">
        <div className="brand">
          <PlayerAvatar playerName={playerName} size={48}/>
          <div>
            <div className="brand-name">PULSE</div>
            <div className="brand-sub">{playerName}</div>
          </div>
        </div>
        <div style={{padding:'0 20px 14px'}}><PlayerProfileEditor playerName={playerName} token={token}/></div>
        <button className={"nav-item" + (tab==='performance'?' active':'')} onClick={()=>setTab('performance')}><span className="nav-dot"></span>Performance</button>
        <button className={"nav-item" + (tab==='medica'?' active':'')} onClick={()=>setTab('medica')}><span className="nav-dot"></span>Area Medica</button>
        <button className={"nav-item" + (tab==='strength'?' active':'')} onClick={()=>setTab('strength')}><span className="nav-dot"></span>Area Strength</button>
        <div className="sidebar-foot">Vista personale di {playerName}.<br/>Puoi modificare i Kg della tua scheda e i tuoi dati fisici (altezza/peso/età).</div>
      </div>
      <div className="main">
        <ErrorBoundary key={tab}>
          {tab==='performance' && (
            sessions===null ? <LoadingState/> : (
              <div>
                <div className="topbar"><div><h1 className="page-title">Performance — {playerName}</h1></div></div>
                <div className="chip-row" style={{marginBottom:20}}>
                  {[{id:'panoramica',label:'Panoramica'},{id:'carico',label:'Gestione Carico'},{id:'storico',label:'Storico Parametri'}].map(t => (
                    <button key={t.id} className={"chip" + (playerTab===t.id?" on":"")} onClick={()=>setPlayerTab(t.id)}>{t.label}</button>
                  ))}
                </div>
                {playerTab==='panoramica' ? <PanoramicaTab sessions={sessions}/> :
                 playerTab==='carico' ? <CaricoTab sessions={sessions}/> :
                 <StoricoTab sessions={sessions}/>}
              </div>
            )
          )}
          {tab==='medica' && (
            <div>
              <div className="topbar"><div><h1 className="page-title">Area Medica — {playerName}</h1></div></div>
              <AthleteMedicalView playerName={playerName}/>
            </div>
          )}
          {tab==='strength' && (
            <div>
              <div className="topbar"><div><h1 className="page-title">Area Strength — {playerName}</h1></div></div>
              <AthleteGymSheet playerName={playerName} token={token}/>
            </div>
          )}
        </ErrorBoundary>
      </div>
    </div>
  );
}

/* =================================================================
   VISTA FISIOTERAPISTA — accesso ristretto tramite link staff
   (?fisio=TOKEN). Solo Area Medica, ma con permessi completi di
   modifica al suo interno (test, documenti, infortuni).
   ================================================================= */

function PhysioView({token}){
  const [valid, setValid] = useState(null);
  const [error, setError] = useState(null);
  const [lang, setLang] = useState('it');

  React.useEffect(() => {
    resolveStaffToken(token).then(()=>setValid(true)).catch(e=>{ setValid(false); setError(e.message); });
  }, [token]);

  const t = (key) => (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.it[key] || key;

  if(valid === null) return <div style={{padding:40}}><LoadingState/></div>;
  if(valid === false) return <div style={{padding:40}}><ErrorState message={error || 'Link non valido.'}/></div>;

  return (
    <LangContext.Provider value={{lang, t}}>
      <div className="app">
        <div className="sidebar">
          <div className="brand">
            <div className="brand-mark"></div>
            <div>
              <div className="brand-name">PULSE</div>
              <div className="brand-sub">Accesso Fisioterapista</div>
            </div>
          </div>
          <LanguageSelector lang={lang} setLang={setLang}/>
          <div className="nav-item active"><span className="nav-dot"></span>{t('area_medica')}</div>
          <div className="sidebar-foot">Accesso limitato all'Area Medica.</div>
        </div>
        <div className="main"><ErrorBoundary><AreaMedicaPage/></ErrorBoundary></div>
      </div>
    </LangContext.Provider>
  );
}

function PrivatePhysioView({token}){
  const [playerName, setPlayerName] = useState(null);
  const [error, setError] = useState(null);
  const [lang, setLang] = useState('it');

  React.useEffect(() => {
    resolvePlayerPhysioToken(token).then(setPlayerName).catch(e=>setError(e.message));
  }, [token]);

  const t = (key) => (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.it[key] || key;

  if(error) return <div style={{padding:40}}><ErrorState message={error}/></div>;
  if(playerName === null) return <div style={{padding:40}}><LoadingState/></div>;

  return (
    <LangContext.Provider value={{lang, t}}>
      <div className="app">
        <div className="sidebar">
          <div className="brand">
            <PlayerAvatar playerName={playerName} size={48}/>
            <div>
              <div className="brand-name">PULSE</div>
              <div className="brand-sub">Fisioterapista — {playerName}</div>
            </div>
          </div>
          <LanguageSelector lang={lang} setLang={setLang}/>
          <div className="nav-item active"><span className="nav-dot"></span>{t('area_medica')}</div>
          <div className="sidebar-foot">Accesso limitato ai dati medici di {playerName}.</div>
        </div>
        <div className="main">
          <ErrorBoundary>
            <div className="topbar"><div><h1 className="page-title">{t('area_medica')} — {playerName}</h1></div></div>
            <InjuryLogPanel playerName={playerName}/>
            <div style={{marginTop:16}}><RehabTab playerName={playerName}/></div>
          </ErrorBoundary>
        </div>
      </div>
    </LangContext.Provider>
  );
}

document.getElementById('root').dataset.mounted = "1";
const _athleteToken = new URLSearchParams(window.location.search).get('atleta');
const _physioToken = new URLSearchParams(window.location.search).get('fisio');
const _privatePhysioToken = new URLSearchParams(window.location.search).get('fisioprivato');
const _rootView = _athleteToken ? <AthleteView token={_athleteToken}/>
  : _physioToken ? <PhysioView token={_physioToken}/>
  : _privatePhysioToken ? <PrivatePhysioView token={_privatePhysioToken}/>
  : <App/>;
ReactDOM.createRoot(document.getElementById('root')).render(_rootView);
</script>
</body>
</html>
