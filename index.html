<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse — GPS Performance Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --pitch-000:#0B120D;
    --pitch-050:#0F1810;
    --pitch-100:#141F16;
    --pitch-200:#1C2A1F;
    --line:#2A3A2E;
    --text-hi:#EFF3EC;
    --text-lo:#8FA091;
    --lime:#A6E22E;
    --lime-dim:#5C7A2E;
    --amber:#E8A33D;
    --red:#E15B4E;
    --blue:#5FA8D3;
    --violet:#9B8CE8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--pitch-000); color:var(--text-hi); font-family:'Barlow',sans-serif; height:100%;}
  #root{min-height:100vh;}
  ::selection{background:var(--lime); color:var(--pitch-000);}
  h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:0.2px;}
  .num{font-variant-numeric: tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  a{color:inherit;}

  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--pitch-050);
    border-right:1px solid var(--line); padding:28px 18px;
    display:flex; flex-direction:column; gap:6px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:baseline; gap:8px; padding:0 10px 26px 10px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .brand-mark{width:11px; height:11px; background:var(--lime); border-radius:2px; transform:rotate(45deg); flex-shrink:0;}
  .brand-name{font-family:'Barlow Condensed'; font-weight:800; font-size:22px; letter-spacing:0.5px;}
  .brand-sub{font-size:11px; color:var(--text-lo);}

  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:11px 12px; border-radius:6px; color:var(--text-lo);
    font-size:15px; font-weight:500; border:none; background:transparent; text-align:left; width:100%;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover{background:var(--pitch-100); color:var(--text-hi);}
  .nav-item.active{background:var(--pitch-200); color:var(--lime);}
  .nav-dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0.7; flex-shrink:0;}

  .sidebar-foot{margin-top:auto; padding:14px 12px 0 12px; border-top:1px solid var(--line); font-size:12px; color:var(--text-lo); line-height:1.5;}

  /* Mobile menu button */
  .menu-btn{display:none;}

  /* Main */
  .main{flex:1; min-width:0; padding:30px 40px 60px 40px;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; gap:20px; flex-wrap:wrap;}
  .page-title{font-size:26px; line-height:1;}
  .page-sub{color:var(--text-lo); font-size:14.5px; margin-top:6px;}

  .controls{display:flex; gap:10px; flex-wrap:wrap;}
  select, .pill-btn{
    background:var(--pitch-100); border:1px solid var(--line); color:var(--text-hi);
    padding:9px 14px; border-radius:7px; font-size:13.5px; font-weight:500;
  }
  select:focus{outline:1px solid var(--lime);}

  /* Grid + cards */
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:2fr 1fr;}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media(max-width:1000px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }

  .card{
    background:var(--pitch-050); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px;
  }
  .card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .card-title{font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-lo); font-weight:600;}

  .kpi-card .kpi-value{font-family:'Barlow Condensed'; font-size:26px; font-weight:700; line-height:1;}
  .kpi-card .kpi-label{color:var(--text-lo); font-size:11.5px; margin-top:4px;}
  .kpi-card .kpi-delta{font-size:12.5px; margin-top:10px; display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:20px;}
  .kpi-up{background:rgba(166,226,46,0.12); color:var(--lime);}
  .kpi-down{background:rgba(225,91,78,0.12); color:var(--red);}
  .kpi-flat{background:rgba(143,160,145,0.12); color:var(--text-lo);}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; color:var(--text-lo); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; padding:6px 8px; border-bottom:1px solid var(--line);}
  td{padding:7px 8px; border-bottom:1px solid var(--pitch-100);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--pitch-100);}
  .row-player{display:flex; align-items:center; gap:10px;}
  .avatar{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-family:'Barlow Condensed'; color:var(--pitch-000); flex-shrink:0;}

  .badge{padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600; display:inline-block;}
  .badge-ok{background:rgba(166,226,46,0.14); color:var(--lime);}
  .badge-warn{background:rgba(232,163,61,0.16); color:var(--amber);}
  .badge-danger{background:rgba(225,91,78,0.16); color:var(--red);}

  .legend-row{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-lo);}
  .legend-swatch{width:10px; height:10px; border-radius:2px;}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
  .chip{
    padding:7px 13px; border-radius:20px; font-size:13px; font-weight:500;
    border:1px solid var(--line); background:var(--pitch-100); color:var(--text-lo);
  }
  .chip.on{border-color: var(--player-color, var(--lime)); color:var(--text-hi); background:var(--pitch-200);}
  .chip-swatch{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px;}

  .empty-hint{color:var(--text-lo); font-size:13.5px; padding:30px 0; text-align:center;}

  .zone-bar-wrap{display:flex; flex-direction:column; gap:9px;}
  .zone-row{display:grid; grid-template-columns:120px 1fr 60px; align-items:center; gap:10px; font-size:13px;}
  .zone-track{height:9px; background:var(--pitch-100); border-radius:5px; overflow:hidden;}
  .zone-fill{height:100%; border-radius:5px;}

  .section-note{font-size:12.5px; color:var(--text-lo); line-height:1.6; margin-top:8px;}

  /* Chart primitives */
  .chart-wrap{position:relative; width:100%;}
  .chart-svg{width:100%; height:auto; display:block; overflow:visible;}
  .chart-tooltip{
    position:absolute; pointer-events:none; background:var(--pitch-200); border:1px solid var(--line);
    padding:9px 12px; border-radius:8px; font-size:12.5px; transform:translate(-50%,-108%);
    white-space:nowrap; z-index:5; box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  .chart-tooltip .t-label{color:var(--text-lo); margin-bottom:4px; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;}
  .chart-tooltip .t-row{display:flex; justify-content:space-between; gap:16px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-track{background:var(--pitch-050);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
</style>
</head>
<body>
<div id="root"><div style="padding:40px;font-family:sans-serif;color:#8FA091;background:#0B120D;min-height:100vh;">Caricamento di Pulse in corso…</div></div>

<script>
  window.addEventListener('error', function(e){
    var root = document.getElementById('root');
    if(root && !root.dataset.mounted){
      root.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#E15B4E;background:#0B120D;min-height:100vh;">Errore nel caricamento: ' + (e.message||'sconosciuto') + '. Prova a ricaricare la pagina o ad aprirla con un altro browser.</div>';
    }
  });
</script>

<script type="text/babel" data-presets="react,env">
const {useState, useMemo, useRef} = React;

/* =================================================================
   CHART PRIMITIVES — SVG puro, nessuna libreria esterna
   ================================================================= */

const VB_W = 640, VB_H_DEFAULT = 200;
const PAD = {top:14, right:16, bottom:40, left:44};

function niceTicks(min, max, count){
  if(min === max){ min -= 1; max += 1; }
  const range = max - min;
  const step = range / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step)));
  const norm = step / mag;
  let niceStep;
  if(norm < 1.5) niceStep = 1*mag;
  else if(norm < 3) niceStep = 2*mag;
  else if(norm < 7) niceStep = 5*mag;
  else niceStep = 10*mag;
  const niceMin = Math.floor(min/niceStep)*niceStep;
  const niceMax = Math.ceil(max/niceStep)*niceStep;
  const ticks = [];
  for(let v=niceMin; v<=niceMax+1e-9; v+=niceStep) ticks.push(+v.toFixed(6));
  return ticks;
}

function fmtNum(n, d=0){
  if(n === null || n === undefined || Number.isNaN(n)) return '—';
  return n.toLocaleString('it-IT', {minimumFractionDigits:d, maximumFractionDigits:d});
}

/* Multi-series line/area chart with hover tooltip, reference bands/lines */
function TrendChart({data, xKey, series, height=VB_H_DEFAULT, area=false, unit='', yMin, yMax, refBands=[], refLines=[]}){
  const wrapRef = useRef(null);
  const [hover, setHover] = useState(null);
  const w = VB_W, h = height;
  const plotW = w - PAD.left - PAD.right;
  const plotH = h - PAD.top - PAD.bottom;

  const allVals = data.flatMap(d => series.map(s => d[s.key])).filter(v => typeof v === 'number');
  const dataMin = allVals.length ? Math.min(...allVals) : 0;
  const dataMax = allVals.length ? Math.max(...allVals) : 1;
  const lo = yMin !== undefined ? yMin : Math.min(dataMin, 0);
  const hi = yMax !== undefined ? yMax : dataMax;
  const ticks = niceTicks(lo, hi, 4);
  const yLo = ticks[0], yHi = ticks[ticks.length-1];

  const n = data.length;
  const xPos = (i) => n <= 1 ? PAD.left + plotW/2 : PAD.left + (i/(n-1))*plotW;
  const yPos = (v) => PAD.top + plotH - ((v - yLo)/((yHi-yLo)||1))*plotH;

  const labelEvery = Math.max(1, Math.ceil(n / 8));

  const handleMove = (e) => {
    const svg = e.currentTarget;
    const rect = svg.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width * w;
    let idx = n<=1 ? 0 : Math.round(((relX - PAD.left)/plotW)*(n-1));
    idx = Math.max(0, Math.min(n-1, idx));
    setHover(idx);
  };

  return (
    <div className="chart-wrap" ref={wrapRef}>
      <svg className="chart-svg" viewBox={`0 0 ${w} ${h}`} onMouseMove={handleMove} onMouseLeave={()=>setHover(null)}>
        {ticks.map((t,i) => (
          <g key={i}>
            <line x1={PAD.left} x2={w-PAD.right} y1={yPos(t)} y2={yPos(t)} stroke="#1C2A1F" strokeWidth="1"/>
            <text x={PAD.left-8} y={yPos(t)+4} fill="#8FA091" fontSize="11" textAnchor="end">{fmtNum(t)}</text>
          </g>
        ))}
        {refBands.map((b,i) => (
          <rect key={'b'+i} x={PAD.left} y={yPos(b.y2)} width={plotW} height={Math.max(0,yPos(b.y1)-yPos(b.y2))} fill={b.color||'#A6E22E'} opacity={b.opacity||0.08}/>
        ))}
        {refLines.map((r,i) => (
          <g key={'r'+i}>
            <line x1={PAD.left} x2={w-PAD.right} y1={yPos(r.y)} y2={yPos(r.y)} stroke={r.color||'#E15B4E'} strokeWidth="1.4" strokeDasharray="5 4"/>
            {r.label && <text x={w-PAD.right} y={yPos(r.y)-5} fill={r.color||'#E15B4E'} fontSize="10.5" textAnchor="end">{r.label}</text>}
          </g>
        ))}
        {data.map((d,i) => (i % labelEvery === 0 || i === n-1) && (
          <text key={'x'+i} x={xPos(i)} y={h-8} fill="#8FA091" fontSize="10.5" textAnchor="middle">{d[xKey]}</text>
        ))}
        {series.map(s => {
          const pts = data.map((d,i) => [xPos(i), yPos(d[s.key])]);
          const linePath = pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
          const areaPath = area ? linePath + ` L${pts[pts.length-1][0].toFixed(1)},${yPos(yLo).toFixed(1)} L${pts[0][0].toFixed(1)},${yPos(yLo).toFixed(1)} Z` : null;
          const gid = 'grad-'+s.key.replace(/[^a-zA-Z0-9]/g,'');
          return (
            <g key={s.key}>
              {area && <defs>
                <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={s.color} stopOpacity="0.32"/>
                  <stop offset="100%" stopColor={s.color} stopOpacity="0"/>
                </linearGradient>
              </defs>}
              {area && <path d={areaPath} fill={`url(#${gid})`} stroke="none"/>}
              <path d={linePath} fill="none" stroke={s.color} strokeWidth="2.3" strokeLinejoin="round" strokeLinecap="round"/>
              {n <= 30 && pts.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r="2.6" fill={s.color}/>)}
            </g>
          );
        })}
        {hover !== null && (
          <line x1={xPos(hover)} x2={xPos(hover)} y1={PAD.top} y2={h-PAD.bottom} stroke="#8FA091" strokeWidth="1" strokeDasharray="3 3"/>
        )}
      </svg>
      {hover !== null && (
        <div className="chart-tooltip" style={{left: (xPos(hover)/w*100)+'%', top: (PAD.top/h*100)+'%'}}>
          <div className="t-label">{data[hover][xKey]}</div>
          {series.map(s => (
            <div className="t-row" key={s.key}>
              <span style={{color:s.color}}>{s.name}</span>
              <span className="num">&nbsp;{fmtNum(data[hover][s.key], unit==='km'?1:0)} {unit}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* Grouped bar chart, 2 series */
function BarChart2({data, xKey, series, height=VB_H_DEFAULT, unit='', refLine}){
  const [hover, setHover] = useState(null);
  const w = VB_W, h = height;
  const plotW = w - PAD.left - PAD.right;
  const plotH = h - PAD.top - PAD.bottom;
  const allVals = data.flatMap(d => series.map(s => d[s.key]));
  const maxV = Math.max(...allVals, refLine?.value||0, 1);
  const ticks = niceTicks(0, maxV, 4);
  const yHi = ticks[ticks.length-1];
  const yPos = (v) => PAD.top + plotH - (v/(yHi||1))*plotH;

  const n = data.length;
  const groupW = plotW / n;
  const barW = Math.min(24, groupW*0.22);
  const gap = 6;

  return (
    <div className="chart-wrap">
      <svg className="chart-svg" viewBox={`0 0 ${w} ${h}`}>
        {ticks.map((t,i) => (
          <g key={i}>
            <line x1={PAD.left} x2={w-PAD.right} y1={yPos(t)} y2={yPos(t)} stroke="#1C2A1F" strokeWidth="1"/>
            <text x={PAD.left-8} y={yPos(t)+4} fill="#8FA091" fontSize="11" textAnchor="end">{fmtNum(t)}</text>
          </g>
        ))}
        {data.map((d,i) => {
          const cx = PAD.left + groupW*i + groupW/2;
          return (
            <g key={i} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}>
              <rect x={cx-groupW/2} y={PAD.top} width={groupW} height={plotH} fill="transparent"/>
              {series.map((s,si) => {
                const bx = cx - barW - gap/2 + si*(barW+gap);
                const bh = plotH - (yPos(d[s.key]) - PAD.top);
                return <rect key={s.key} x={bx} y={yPos(d[s.key])} width={barW} height={Math.max(0,bh)} fill={s.color} opacity={hover===i?1:0.88} rx="3"/>;
              })}
              <text x={cx} y={h-6} fill="#8FA091" fontSize="9" textAnchor="end" transform={`rotate(-40 ${cx} ${h-6})`}>{d[xKey]}</text>
            </g>
          );
        })}
        {refLine && (
          <g>
            <line x1={PAD.left} x2={w-PAD.right} y1={yPos(refLine.value)} y2={yPos(refLine.value)} stroke={refLine.color||'#E8A33D'} strokeWidth="1.4" strokeDasharray="5 4"/>
            <text x={w-PAD.right} y={yPos(refLine.value)-5} fill={refLine.color||'#E8A33D'} fontSize="10" textAnchor="end">{refLine.label||''}</text>
          </g>
        )}
      </svg>
      {hover !== null && (
        <div className="chart-tooltip" style={{left: ((PAD.left + (VB_W-PAD.left-PAD.right)/data.length*(hover+0.5))/w*100)+'%', top: (PAD.top/h*100)+'%'}}>
          <div className="t-label">{data[hover][xKey]}</div>
          {series.map(s => (
            <div className="t-row" key={s.key}>
              <span style={{color:s.color}}>{s.name}</span>
              <span className="num">&nbsp;{fmtNum(data[hover][s.key])} {unit}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* Radar / spider chart, values expected 0-100 */
/* Grafico a colonne che mostra, dentro ogni barra, la % rispetto al picco
   "corrente" (il massimo osservato fino a quel punto in ordine cronologico).
   Ogni volta che una barra supera il record precedente, diventa essa stessa
   il nuovo 100% per le barre successive. */
function PeakBarChart({data, xKey, series, height=VB_H_DEFAULT, unit=''}){
  const [hover, setHover] = useState(null);
  const w = VB_W, h = height;
  const plotW = w - PAD.left - PAD.right;
  const plotH = h - PAD.top - PAD.bottom;
  const allVals = data.flatMap(d => series.map(s => d[s.key]||0));
  const maxV = Math.max(...allVals, 1);
  const ticks = niceTicks(0, maxV, 4);
  const yHi = ticks[ticks.length-1];
  const yPos = (v) => PAD.top + plotH - (v/(yHi||1))*plotH;

  const n = data.length;
  const groupW = plotW / n;
  const barW = Math.min(20, (groupW*0.5) / series.length);
  const gap = 4;

  // Picco progressivo per ciascuna serie (giocatore)
  const runningPeaks = {};
  series.forEach(s => {
    let peak = 0;
    runningPeaks[s.key] = data.map(d => {
      peak = Math.max(peak, d[s.key]||0);
      return peak;
    });
  });

  return (
    <div className="chart-wrap">
      <svg className="chart-svg" viewBox={`0 0 ${w} ${h}`}>
        {ticks.map((t,i) => (
          <g key={i}>
            <line x1={PAD.left} x2={w-PAD.right} y1={yPos(t)} y2={yPos(t)} stroke="#1C2A1F" strokeWidth="1"/>
            <text x={PAD.left-8} y={yPos(t)+4} fill="#8FA091" fontSize="11" textAnchor="end">{fmtNum(t)}</text>
          </g>
        ))}
        {data.map((d,i) => {
          const cx = PAD.left + groupW*i + groupW/2;
          const totalBarsW = barW*series.length + gap*(series.length-1);
          return (
            <g key={i} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}>
              <rect x={cx-groupW/2} y={PAD.top} width={groupW} height={plotH} fill="transparent"/>
              {series.map((s,si) => {
                const value = d[s.key]||0;
                const peak = runningPeaks[s.key][i] || 0;
                const pct = peak>0 ? (value/peak)*100 : 0;
                const bx = cx - totalBarsW/2 + si*(barW+gap);
                const barTop = yPos(value);
                const bh = plotH - (barTop - PAD.top);
                return (
                  <g key={s.key}>
                    <rect x={bx} y={barTop} width={barW} height={Math.max(0,bh)} fill={s.color} opacity={hover===i?1:0.88} rx="3"/>
                    {bh > 20 && barW > 20 && (
                      <text x={bx+barW/2} y={barTop+13} fill="#0B120D" fontSize="7" fontWeight="700" textAnchor="middle">{fmtNum(pct,0)}%</text>
                    )}
                  </g>
                );
              })}
              <text x={cx} y={h-6} fill="#8FA091" fontSize="9" textAnchor="end" transform={`rotate(-40 ${cx} ${h-6})`}>{d[xKey]}</text>
            </g>
          );
        })}
      </svg>
      {hover !== null && (
        <div className="chart-tooltip" style={{left: ((PAD.left + (VB_W-PAD.left-PAD.right)/data.length*(hover+0.5))/w*100)+'%', top: (PAD.top/h*100)+'%'}}>
          <div className="t-label">{data[hover][xKey]}</div>
          {series.map(s => {
            const value = data[hover][s.key]||0;
            const peak = runningPeaks[s.key][hover] || 0;
            const pct = peak>0 ? (value/peak)*100 : 0;
            return (
              <div className="t-row" key={s.key}>
                <span style={{color:s.color}}>{s.name}</span>
                <span className="num">&nbsp;{fmtNum(value)} {unit} ({fmtNum(pct,0)}% del picco)</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function RadarChart({data, metricKey, series, height=240, domainMin=0, domainMax=100, ringLabels}){
  const w = VB_W, h = height;
  const cx = w/2, cy = h/2 + 6;
  const R = Math.min(w,h)/2 - 34;
  const N = data.length;
  const angle = (i) => -Math.PI/2 + i*(2*Math.PI/N);
  const ringCount = 4;
  const ringVals = Array.from({length:ringCount}, (_,i) => domainMin + ((i+1)/ringCount)*(domainMax-domainMin));

  const toFrac = (val) => {
    const clamped = Math.max(domainMin, Math.min(domainMax, val));
    return (clamped - domainMin) / (domainMax - domainMin || 1);
  };
  const pointFor = (i, frac) => {
    const r = frac*R;
    const a = angle(i);
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };

  return (
    <div className="chart-wrap">
      <svg className="chart-svg" viewBox={`0 0 ${w} ${h}`}>
        {ringVals.map((rv,ri) => {
          const pts = data.map((d,i) => pointFor(i, (ri+1)/ringCount));
          return <polygon key={ri} points={pts.map(p=>p.join(',')).join(' ')} fill="none" stroke="#2A3A2E" strokeWidth="1"/>;
        })}
        {data.map((d,i) => {
          const [ex,ey] = pointFor(i, 1);
          return <line key={i} x1={cx} y1={cy} x2={ex} y2={ey} stroke="#2A3A2E" strokeWidth="1"/>;
        })}
        {data.map((d,i) => {
          const [lx,ly] = pointFor(i, 1.16);
          return <text key={'l'+i} x={lx} y={ly+4} fill="#8FA091" fontSize="10" textAnchor="middle">{d[metricKey]}</text>;
        })}
        {series.map(s => {
          const pts = data.map((d,i) => pointFor(i, toFrac(d[s.key]||0)));
          return (
            <g key={s.key}>
              <polygon points={pts.map(p=>p.join(',')).join(' ')} fill={s.color} fillOpacity="0.16" stroke={s.color} strokeWidth="2"/>
              {pts.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r="2.4" fill={s.color}/>)}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* Grafico a torta — usato per la distribuzione delle tipologie di infortunio */
const PIE_PALETTE = ['#A6E22E','#5FA8D3','#E8A33D','#E15B4E','#9B8CE8','#4FD3B8','#E8D53D','#D35FA8'];

function PieChart({data, height=260}){
  const w = VB_W, h = height;
  const cx = w/2, cy = h/2;
  const R = Math.min(w,h)/2 - 20;
  const total = data.reduce((a,d)=>a+d.value, 0);
  if(total === 0) return <div className="empty-hint">Nessun dato da mostrare.</div>;

  let angleStart = -Math.PI/2;
  const slices = data.map((d,i) => {
    const frac = d.value/total;
    const angleEnd = angleStart + frac*2*Math.PI;
    const x1 = cx + R*Math.cos(angleStart), y1 = cy + R*Math.sin(angleStart);
    const x2 = cx + R*Math.cos(angleEnd), y2 = cy + R*Math.sin(angleEnd);
    const largeArc = (angleEnd-angleStart) > Math.PI ? 1 : 0;
    const path = `M ${cx},${cy} L ${x1},${y1} A ${R},${R} 0 ${largeArc} 1 ${x2},${y2} Z`;
    const midAngle = (angleStart+angleEnd)/2;
    const labelR = R*0.68;
    const lx = cx + labelR*Math.cos(midAngle), ly = cy + labelR*Math.sin(midAngle);
    const slice = { path, color: PIE_PALETTE[i%PIE_PALETTE.length], pct: frac*100, lx, ly, label:d.label, value:d.value };
    angleStart = angleEnd;
    return slice;
  });

  return (
    <div className="chart-wrap">
      <svg className="chart-svg" viewBox={`0 0 ${w} ${h}`}>
        {slices.map((s,i) => (
          <g key={i}>
            <path d={s.path} fill={s.color} fillOpacity="0.85" stroke="var(--pitch-050)" strokeWidth="2"/>
            {s.pct > 5 && <text x={s.lx} y={s.ly} fill="#0B120D" fontSize="11" fontWeight="700" textAnchor="middle">{fmtNum(s.pct,0)}%</text>}
          </g>
        ))}
      </svg>
      <div className="legend-row">
        {slices.map((s,i) => (
          <div className="legend-item" key={i}>
            <span className="legend-swatch" style={{background:s.color}}></span>{s.label} ({s.value})
          </div>
        ))}
      </div>
    </div>
  );
}

function ChartLegend({series}){
  return (
    <div className="legend-row">
      {series.map(s => (
        <div className="legend-item" key={s.key || s.name}>
          <span className="legend-swatch" style={{background:s.color}}></span>{s.name}
        </div>
      ))}
    </div>
  );
}

const TEAM_ID = 46247;
const MAX_SESSIONS = 20; // quante sessioni recenti caricare

// Drill che rappresentano una sessione "completa" (evitiamo di sommare
// sotto-esercizi come Aerobic/Agility Training per non duplicare la distanza)
function isFullSession(drill){
  const d = (drill || '').toLowerCase();
  return d.startsWith('full training') || d.startsWith('full match') ||
         d.startsWith('full extra time') || d === 'partita';
}

// Etichette leggibili per i parametri K-Sport riconosciuti con certezza.
// I parametri il cui significato esatto non è documentato restano con il
// codice originale invece di una traduzione inventata.
const PARAM_LABELS = {
  D: 'Distanza totale (m)',
  T: 'Durata (s)',
  Drel: 'Distanza al minuto (m/min)',
  EDRel: 'Distanza equivalente al minuto (m/min)',
  EEE: 'Spesa energetica (kJ/kg) — indicatore di carico totale',
  AMP: 'Potenza metabolica media (W/kg)',
  '%ED': '% distanza equivalente',
  '%AI': '% spesa anaerobica',
  Smax: 'Velocità massima (m/s)',
  D_SHI: 'Distanza ad alta velocità (m)',
  T_SHI: 'Tempo ad alta velocità (s)',
  D_AccHI: 'Distanza ad alta accelerazione (m)',
  D_DecHI: 'Distanza ad alta decelerazione (m)',
  D_MPHI: 'Distanza ad alta potenza metabolica (m)',
  T_MPHI: 'Tempo ad alta potenza metabolica (s)',
  '%D_SHI': '% distanza ad alta velocità',
  '%D_AccHI': '% distanza ad alta accelerazione',
  '%D_DecHI': '% distanza ad alta decelerazione',
  '%D_MPHI': '% distanza ad alta potenza metabolica',
  D_S3: 'Distanza nella soglia di velocità 3 (m)',
  D_S4: 'Distanza nella soglia di velocità 4 (m)',
  D_S5: 'Distanza nella soglia di velocità 5 (m)',
  D_S6: 'Distanza nella soglia di velocità 6 (m)',
  D_S7: 'Distanza nella soglia di velocità 7 (m)',
  T_MP1: 'Tempo nella soglia di potenza metabolica 1 (s)',
  ND_MP1: 'N° ingressi nella soglia di potenza metabolica 1 (da soglia superiore)',
};

function paramsToObject(dataArray){
  const obj = {};
  (dataArray || []).forEach(d => { obj[d.ParameterName] = d.Value; });
  return obj;
}

/* Chiama le funzioni serverless /api/* (mai le API K-Sport direttamente:
   le credenziali restano protette lato server). */
async function apiGet(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error('Errore di rete (' + res.status + ')');
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json;
}

async function loadPlayers(){
  const resp = await apiGet(`/api/players?teamID=${TEAM_ID}`);
  const list = (resp.Data && resp.Data.Players) || [];
  // "Team Average" non è un giocatore reale, lo escludiamo dal selettore
  return list.filter(p => (p.PlayerName || '').toLowerCase() !== 'team average');
}

/* Unisce più "tagli" K-Sport dello stesso giorno (es. Full Training +
   Aerobic Training) in un unico set di parametri: somma i valori
   cumulativi (distanza, tempo, ecc.), prende il MASSIMO per i picchi
   (es. velocità massima), e ricalcola correttamente le percentuali
   invece di sommarle (sarebbe scorretto matematicamente). */
function mergeRawParams(rawList){
  if(rawList.length === 1) return rawList[0];
  const keys = new Set();
  rawList.forEach(r => Object.keys(r).forEach(k=>keys.add(k)));
  const merged = {};
  const durations = rawList.map(r => r.T || 0);
  const totalT = durations.reduce((a,b)=>a+b,0);
  keys.forEach(k => {
    const vals = rawList.map(r => r[k]).filter(v => typeof v === 'number');
    if(vals.length === 0){ merged[k] = 0; return; }
    if(k === 'Smax'){ merged[k] = Math.max(...vals); return; }
    if(k.startsWith('%')){
      if(totalT > 0){
        let weighted = 0;
        rawList.forEach((r,i) => { weighted += (r[k]||0) * (durations[i]||0); });
        merged[k] = weighted/totalT;
      } else {
        merged[k] = vals.reduce((a,b)=>a+b,0)/vals.length;
      }
      return;
    }
    merged[k] = vals.reduce((a,b)=>a+b,0);
  });
  if(merged.T > 0){
    merged.Drel = merged.D / (merged.T/60);
  }
  return merged;
}

/* Raggruppa le sessioni K-Sport per giorno di calendario (invece che per
   singolo Session_ID), così più registrazioni dello stesso allenamento
   diventano una sola colonna/data nei grafici. */
function groupSessionsByDay(fullSessions, maxDays){
  const groups = {};
  fullSessions.forEach(s => {
    const dayKey = new Date(s.Date * 1000).toISOString().slice(0,10);
    if(!groups[dayKey]) groups[dayKey] = [];
    groups[dayKey].push(s);
  });
  const dayKeys = Object.keys(groups).sort((a,b) => b.localeCompare(a)).slice(0, maxDays);
  return dayKeys.map(k => groups[k]);
}

async function loadPlayerSessions(playerNameFilter){
  const sessionsResp = await apiGet(`/api/sessions?teamID=${TEAM_ID}`);
  const all = (sessionsResp.Records || []);
  const fullSessions = all.filter(s => isFullSession(s.Drill));
  const dayGroups = groupSessionsByDay(fullSessions, MAX_SESSIONS);

  const detailed = await Promise.all(dayGroups.map(async (dayGroup) => {
    try{
      const results = await Promise.all(dayGroup.map(s =>
        apiGet(`/api/session-data?sessionId=${s.Session_ID}&players=${encodeURIComponent(playerNameFilter)}`)
      ));
      const rawList = results
        .map(detail => detail.Data && detail.Data.Players && detail.Data.Players[0])
        .filter(Boolean)
        .map(player => paramsToObject(player.Data));
      if(rawList.length === 0) return null;
      const p = mergeRawParams(rawList);
      const durationSec = p.T || 0;
      const durationMin = durationSec / 60;
      const distance = p.D || 0;
      const repDrill = dayGroup.find(s => /full training|full match/i.test(s.Drill)) || dayGroup[0];
      return {
        sessionId: repDrill.Session_ID,
        dateUnix: repDrill.Date,
        dateObj: new Date(repDrill.Date * 1000),
        label: new Date(repDrill.Date * 1000).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'2-digit'}),
        fullLabel: dayGroup.length > 1 ? `${repDrill.Session} (+${dayGroup.length-1} tagli)` : repDrill.Session,
        isMatch: dayGroup.some(s => /full match|partita|extra time/i.test(s.Drill)),
        raw: p,
        distance,
        eee: p.EEE || 0,
        durationSec,
        durationMin,
        maxSpeedMs: p.Smax || 0,
        maxSpeedKmh: (p.Smax || 0) * 3.6,
        distPerMin: p.Drel || (durationMin > 0 ? distance / durationMin : 0),
        hiDistance: p.D_SHI || 0,
        hiTime: p.T_SHI || 0,
        accHiDistance: p.D_AccHI || 0,
        decHiDistance: p.D_DecHI || 0,
        pctHi: p['%D_SHI'] || 0,
        zones: { z4: p.D_S4 || 0, z5: p.D_S5 || 0, z6: p.D_S6 || 0, z7: p.D_S7 || 0 },
      };
    } catch(e){
      return null;
    }
  }));

  return detailed.filter(Boolean).sort((a,b) => a.dateUnix - b.dateUnix);
}

/* Carica le sessioni di TUTTA la squadra insieme (senza filtro giocatore),
   usata per il confronto tra più atleti e per il K-Compare. */
const MAX_TEAM_SESSIONS = 40; // copre circa 1-2 mesi di allenamenti

async function loadTeamSessions(){
  const sessionsResp = await apiGet(`/api/sessions?teamID=${TEAM_ID}`);
  const all = (sessionsResp.Records || []);
  const fullSessions = all.filter(s => isFullSession(s.Drill));
  const dayGroups = groupSessionsByDay(fullSessions, MAX_TEAM_SESSIONS);

  const detailed = await Promise.all(dayGroups.map(async (dayGroup) => {
    try{
      const results = await Promise.all(dayGroup.map(s => apiGet(`/api/session-data?sessionId=${s.Session_ID}`)));
      const perPlayerRaws = {};
      results.forEach(detail => {
        const playersList = (detail.Data && detail.Data.Players) || [];
        playersList.forEach(pl => {
          if((pl.PlayerName||'').toLowerCase() === 'team average') return;
          if(!perPlayerRaws[pl.PlayerName]) perPlayerRaws[pl.PlayerName] = [];
          perPlayerRaws[pl.PlayerName].push(paramsToObject(pl.Data));
        });
      });
      const players = {};
      Object.entries(perPlayerRaws).forEach(([name, rawList]) => {
        const p = mergeRawParams(rawList);
        const durationMin = (p.T || 0) / 60;
        const distance = p.D || 0;
        players[name] = {
          distance,
          eee: p.EEE || 0,
          maxSpeedKmh: (p.Smax || 0) * 3.6,
          distPerMin: p.Drel || (durationMin > 0 ? distance / durationMin : 0),
          pctHi: p['%D_SHI'] || 0,
          hiDistance: p.D_SHI || 0,
          accHiDistance: p.D_AccHI || 0,
          decHiDistance: p.D_DecHI || 0,
        };
      });
      const repDrill = dayGroup.find(s => /full training|full match/i.test(s.Drill)) || dayGroup[0];
      return {
        sessionId: repDrill.Session_ID,
        dateUnix: repDrill.Date,
        label: new Date(repDrill.Date * 1000).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'2-digit'}),
        fullLabel: dayGroup.length > 1 ? `${repDrill.Session} (+${dayGroup.length-1} tagli)` : repDrill.Session,
        drill: repDrill.Drill,
        isMatch: dayGroup.some(s => /full match|partita|extra time/i.test(s.Drill)),
        players,
      };
    } catch(e){
      return null;
    }
  }));

  return detailed.filter(Boolean).sort((a,b) => a.dateUnix - b.dateUnix);
}

/* ACWR (rapporto carico acuto:cronico), calcolato sulla Spesa Energetica (EEE,
   kJ/kg) — nel manuale ufficiale K-Sport, EEE compare proprio nella sezione
   "Total Load" del portale insieme a Distanza e Dist/min: è quindi il loro
   indicatore di carico totale, più accurato della semplice distanza. Le
   finestre sono calcolate per indice di sessione (non per giorno di
   calendario), utile perché i dati hanno interruzioni stagionali. */
function computeACWR(sessions){
  return sessions.map((s, i) => {
    const acuteWindow = sessions.slice(Math.max(0,i-6), i+1);
    const chronicWindow = sessions.slice(Math.max(0,i-27), i+1);
    const acute = acuteWindow.reduce((a,x)=>a+x.eee,0) / acuteWindow.length;
    const chronic = chronicWindow.reduce((a,x)=>a+x.eee,0) / chronicWindow.length;
    const ratio = chronic > 0 ? +(acute/chronic).toFixed(2) : 0;
    let status = 'ok';
    if(ratio > 1.5) status = 'danger';
    else if(ratio > 1.3 || ratio < 0.8) status = 'warn';
    return {...s, acute:Math.round(acute), chronic:Math.round(chronic), acwr:ratio, status};
  });
}

const fmt = (n, d=0) => (n||0).toLocaleString('it-IT', {minimumFractionDigits:d, maximumFractionDigits:d});

   EXPORT PDF / EXCEL — report allenamento e picchi di performance
   (interamente nel browser, tramite SheetJS e jsPDF)
   ================================================================= */

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function sessionsExportRows(sessions){
  return sessions.slice().reverse().map(s => ({
    'Data': s.label,
    'Sessione': s.fullLabel,
    'Tipo': s.isMatch ? 'Partita' : 'Allenamento',
    'Distanza (m)': +s.distance.toFixed(0),
    'Durata (min)': +s.durationMin.toFixed(0),
    'Vel. massima (km/h)': +s.maxSpeedKmh.toFixed(1),
    'Distanza/min (m/min)': +s.distPerMin.toFixed(1),
    'EEE (kJ/kg)': +s.eee.toFixed(2),
    '% alta velocità': +s.pctHi.toFixed(1),
  }));
}

function peaksExportRows(sessions){
  return PEAK_METRICS.map(m => {
    const peak = Math.max(...sessions.map(s => s[m.key] || 0));
    const peakSession = sessions.find(s => (s[m.key]||0) === peak);
    const last = sessions[sessions.length-1];
    return {
      'Parametro': m.label,
      'Picco storico': +peak.toFixed(m.dec),
      'Unità': m.unit,
      'Data del picco': peakSession ? peakSession.label : '',
      'Valore ultima sessione': +((last[m.key]||0)).toFixed(m.dec),
      '% rispetto al picco': peak>0 ? +(((last[m.key]||0)/peak)*100).toFixed(0) : 0,
    };
  });
}

function exportPlayerExcel(playerName, sessions){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sessionsExportRows(sessions)), 'Report allenamenti');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(peaksExportRows(sessions)), 'Picchi performance');
  const out = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  downloadBlob(new Blob([out], {type:'application/octet-stream'}), `${playerName}_report.xlsx`);
}

function exportPlayerPdf(playerName, sessions){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text(`Report — ${playerName}`, 14, 16);
  doc.setFontSize(10);
  doc.text(`Generato il ${new Date().toLocaleDateString('it-IT')}`, 14, 22);

  doc.setFontSize(13);
  doc.text('Picchi di performance', 14, 32);
  const peaks = peaksExportRows(sessions);
  doc.autoTable({
    startY: 36,
    head: [Object.keys(peaks[0])],
    body: peaks.map(r => Object.values(r)),
    styles: { fontSize: 8 },
    headStyles: { fillColor: [166,226,46], textColor: [11,18,13] },
  });

  const afterPeaksY = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(13);
  doc.text('Report allenamenti', 14, afterPeaksY);
  const sess = sessionsExportRows(sessions);
  doc.autoTable({
    startY: afterPeaksY + 4,
    head: [Object.keys(sess[0])],
    body: sess.map(r => Object.values(r)),
    styles: { fontSize: 7 },
    headStyles: { fillColor: [95,168,211], textColor: [11,18,13] },
  });

  doc.save(`${playerName}_report.pdf`);
}

function ExportButtons({playerName, sessions}){
  if(!sessions || sessions.length===0) return null;
  return (
    <div style={{display:'flex', gap:8}}>
      <button onClick={()=>exportPlayerPdf(playerName, sessions)} className="pill-btn" style={{cursor:'pointer'}}>⬇ PDF</button>
      <button onClick={()=>exportPlayerExcel(playerName, sessions)} className="pill-btn" style={{cursor:'pointer'}}>⬇ Excel</button>
    </div>
  );
}

function PlayerPhotoUpload({playerName, onUploaded}){
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState(null);
  const inputRef = React.useRef(null);

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setUploading(true);
    try{
      const fileBase64 = await fileToBase64(file);
      await uploadPlayerPhoto(playerName, fileBase64, file.name, file.type);
      if(onUploaded) onUploaded();
    } catch(err){ setError(err.message); }
    setUploading(false);
    if(inputRef.current) inputRef.current.value = '';
  };

  return (
    <div style={{display:'flex', alignItems:'center', gap:8}}>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{display:'none'}} id="player-photo-input"/>
      <button onClick={()=>inputRef.current && inputRef.current.click()} disabled={uploading} className="pill-btn" style={{cursor:'pointer', fontSize:11}}>
        {uploading ? 'Caricamento…' : '📷 Cambia foto'}
      </button>
      {error && <span style={{color:'var(--red)', fontSize:11}}>{error}</span>}
    </div>
  );
}

const PEAK_METRICS = [
  {key:'distance', label:'Distanza', unit:'m', dec:0},
  {key:'maxSpeedKmh', label:'Velocità massima', unit:'km/h', dec:1},
  {key:'distPerMin', label:'Distanza/min', unit:'m/min', dec:1},
  {key:'pctHi', label:'% alta velocità', unit:'%', dec:1},
];

function periodKeyFor(dateObj, period){
  if(period==='month') return dateObj.getFullYear()+'-'+String(dateObj.getMonth()+1).padStart(2,'0');
  if(period==='week'){
    const d = new Date(dateObj);
    const day = (d.getDay()+6)%7; // lunedì = 0
    d.setDate(d.getDate()-day);
    return d.toISOString().slice(0,10);
  }
  return dateObj.toISOString().slice(0,10);
}
function periodLabelFor(key, period){
  if(period==='month'){
    const [y,m] = key.split('-');
    return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('it-IT', {month:'short', year:'2-digit'});
  }
  if(period==='week') return 'Sett. ' + new Date(key).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'});
  return new Date(key).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'});
}

function PanoramicaTab({sessions}){
  const [period, setPeriod] = useState('day');
  const [chartMetric, setChartMetric] = useState('distance');
  if(sessions.length === 0) return <div className="empty-hint">Nessuna sessione disponibile.</div>;
  const last = sessions[sessions.length-1];

  const cm = PEAK_METRICS.find(m=>m.key===chartMetric);
  let chartData;
  if(period === 'day'){
    chartData = sessions.map(s => ({label:s.label, val:+((s[chartMetric]||0)).toFixed(cm.dec)}));
  } else {
    const groups = {};
    sessions.forEach(s => {
      const key = periodKeyFor(s.dateObj, period);
      groups[key] = (groups[key]||0) + (s[chartMetric]||0);
    });
    chartData = Object.keys(groups).sort().map(key => ({label: periodLabelFor(key, period), val: +groups[key].toFixed(cm.dec)}));
  }

  return (
    <div>
      <div className="card" style={{marginBottom:14}}>
        <div className="card-head"><div className="card-title">Ultima sessione — {last.fullLabel} · {last.label}</div></div>
        <div>
          {PEAK_METRICS.map(m => {
            const value = last[m.key] || 0;
            const peak = Math.max(...sessions.map(s => s[m.key] || 0));
            const pct = peak > 0 ? (value/peak)*100 : 0;
            return (
              <div key={m.key} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'9px 4px', borderBottom:'1px solid var(--pitch-100)'}}>
                <span style={{fontSize:13}}>{m.label}</span>
                <div style={{display:'flex', alignItems:'center', gap:12}}>
                  <span style={{fontSize:11.5, color:'var(--text-lo)'}}>Picco: {fmt(peak, m.dec)} {m.unit}</span>
                  <span className="num" style={{fontSize:14, minWidth:70, textAlign:'right'}}>{fmt(value, m.dec)} {m.unit}</span>
                  <span className={"badge " + pctBadgeClass(pct)} style={{fontSize:11, minWidth:52, textAlign:'center'}}>{fmt(pct,0)}%</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <div className="card-title">{cm.label} nel tempo</div>
          <div className="controls">
            <select value={chartMetric} onChange={e=>setChartMetric(e.target.value)} style={{fontSize:12}}>
              {PEAK_METRICS.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}
            </select>
            <select value={period} onChange={e=>setPeriod(e.target.value)} style={{fontSize:12}}>
              <option value="day">Giorno per giorno</option>
              <option value="week">Somma settimanale</option>
              <option value="month">Somma mensile</option>
            </select>
          </div>
        </div>
        <TrendChart data={chartData} xKey="label" area unit={cm.unit}
          series={[{key:'val', name:cm.label, color:'#A6E22E'}]}/>
      </div>
    </div>
  );
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function ExtractedTestsReview({docId, extracted, playerName, onDone, onCancel}){
  const [checked, setChecked] = useState(() => extracted.map(() => true));
  const [testDate, setTestDate] = useState('');
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);

  const toggle = (i) => setChecked(c => c.map((v,idx) => idx===i ? !v : v));

  const handleConfirm = async () => {
    setSaving(true);
    try{
      const selected = extracted.filter((_,i) => checked[i]);
      for(const t of selected){
        await addRehabTest({
          playerName,
          testName: t.testName || 'Test',
          value: t.value !== undefined ? String(t.value) : '',
          unit: t.unit || '',
          notes: `Estratto automaticamente da documento (doc #${docId})`,
          testDate: testDate || null,
        });
      }
      onDone();
    } catch(err){ setError(err.message); }
    setSaving(false);
  };

  return (
    <div className="card" style={{background:'var(--pitch-200)', marginTop:8, borderColor:'var(--lime)'}}>
      <div className="card-head"><div className="card-title">Test trovati nel documento — seleziona quelli da aggiungere</div></div>
      {error && <div className="section-note" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
      {extracted.length === 0 ? <div className="empty-hint">Nessun test riconoscibile in questo documento.</div> : (
        <React.Fragment>
          <div style={{display:'flex', flexDirection:'column', gap:6, marginBottom:12}}>
            {extracted.map((t,i) => (
              <label key={i} style={{display:'flex', alignItems:'center', gap:10, padding:'7px 9px', background:'var(--pitch-100)', borderRadius:6, cursor:'pointer'}}>
                <input type="checkbox" checked={checked[i]} onChange={()=>toggle(i)}/>
                <span style={{fontSize:12.5, flex:1}}>{t.testName}</span>
                <span className="num" style={{fontSize:12.5}}>{t.value} {t.unit}</span>
              </label>
            ))}
          </div>
          <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
            <span style={{fontSize:12, color:'var(--text-lo)'}}>Data dei test (opzionale):</span>
            <input type="date" value={testDate} onChange={e=>setTestDate(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'6px 9px', borderRadius:6, fontSize:12.5}}/>
          </div>
        </React.Fragment>
      )}
      <div style={{display:'flex', gap:8, marginTop:12}}>
        {extracted.length > 0 && (
          <button onClick={handleConfirm} disabled={saving || checked.every(c=>!c)} className="pill-btn on" style={{cursor:'pointer'}}>
            {saving ? 'Aggiunta in corso…' : `Aggiungi ${checked.filter(Boolean).length} test selezionati`}
          </button>
        )}
        <button onClick={onCancel} className="pill-btn" style={{cursor:'pointer'}}>Annulla</button>
      </div>
    </div>
  );
}

  const [reviewFor, setReviewFor] = useState(null); // {docId, extracted}
  const [revealed, setRevealed] = useState({});

  const refresh = () => loadDocuments(playerName).then(setDocs).catch(e=>setError(e.message));
  React.useEffect(() => { refresh(); }, [playerName]);

  const handleUpload = async (e) => {
    e.preventDefault();
    if(!file) return;
    setUploading(true);
    try{
      const fileBase64 = await fileToBase64(file);
      await uploadDocument({ playerName, docType, title: title.trim(), fileBase64, fileName: file.name, mimeType: file.type });
      setTitle(''); setFile(null);
      refresh();
    } catch(err){ setError(err.message); }
    setUploading(false);
  };

  const handleDelete = async (id) => {
    try{ await deleteDocument(id); refresh(); } catch(err){ setError(err.message); }
  };

    if(d.ai_summary){
      setRevealed(r => ({...r, [d.id]: !r[d.id]}));
      return;

    setAnalyzing(d.id);
    try{
      await analyzeDocument(d.id);
      await refresh();
      setRevealed(r => ({...r, [d.id]: true}));
    } catch(err){ setError(err.message); }
    setAnalyzing(null);
  };

    setExtracting(id);
    try{

      setReviewFor({ docId: id, extracted: res.extracted || [] });

                 </span>
               </div>
               <button onClick={()=>handleDelete(d.id)} style={{background:'transparent', border:'none', color:'var(--red)', fontSize:12, cursor:'pointer'}}>✕</button>
             </div>
             <button onClick={()=>handleConsultoIA(d)} disabled={analyzing===d.id} className="pill-btn" style={{marginTop:8, cursor:'pointer', fontSize:11.5}}>
               {analyzing===d.id ? 'Analisi in corso…' : d.ai_summary ? (revealed[d.id] ? 'Nascondi consulto IA' : 'Consulto IA') : 'Consulto IA'}
             </button>

               </div>
             )}
             <button onClick={()=>handleExtract(d.id)} disabled={extracting===d.id} className="pill-btn" style={{marginTop:8, marginLeft:8, cursor:'pointer', fontSize:11.5}}>
               {extracting===d.id ? 'Estrazione in corso…' : 'Estrai test da questo documento'}
             </button>
             {reviewFor && reviewFor.docId === d.id && (
               <ExtractedTestsReview
                 docId={d.id}
                 extracted={reviewFor.extracted}
                 playerName={playerName}
                 onDone={()=>{ setReviewFor(null); }}
                 onCancel={()=>setReviewFor(null)}
               />
             )}
           </div>
         ))}
       </div>
      }
    </div>
  );
}

function RehabTab({playerName}){
  const [tests, setTests] = useState(null);
  const [error, setError] = useState(null);
  const [testName, setTestName] = useState('');
  const [value, setValue] = useState('');
  const [unit, setUnit] = useState('');
  const [notes, setNotes] = useState('');
  const [testDate, setTestDate] = useState('');
  const [generating, setGenerating] = useState(null);
  const [revealed, setRevealed] = useState({});

  const refresh = () => loadRehabTests(playerName).then(setTests).catch(e=>setError(e.message));
  React.useEffect(() => { refresh(); }, [playerName]);

  const handleAdd = async (e) => {
    e.preventDefault();
    if(!testName.trim() || !value.trim()) return;
    try{
      await addRehabTest({ playerName, testName:testName.trim(), value:value.trim(), unit:unit.trim(), notes:notes.trim(), testDate: testDate || null });
      setTestName(''); setValue(''); setUnit(''); setNotes(''); setTestDate('');
      refresh();
    } catch(err){ setError(err.message); }
  };

  const handleDelete = async (id) => {
    try{ await deleteRehabTest(id); refresh(); } catch(err){ setError(err.message); }
  };

  const handleConsultoIA = async (t) => {
    if(t.ai_comment){
      setRevealed(r => ({...r, [t.id]: !r[t.id]}));
      return;
    }
    setGenerating(t.id);
    try{
      await generateAiComment({ testId:t.id, playerName, testName:t.test_name, value:t.value, unit:t.unit, notes:t.notes });
      await refresh();
      setRevealed(r => ({...r, [t.id]: true}));
    } catch(err){ setError(err.message); }
    setGenerating(null);
  };

  return (
    <div>
      {error && <div className="card" style={{borderColor:'var(--red)', marginBottom:16}}><div className="section-note" style={{color:'var(--red)'}}>{error}</div></div>}

      <div className="grid grid-3" style={{marginBottom:16}}>
        <DocumentsPanel playerName={playerName}/>

        <div className="card" style={{gridColumn:'span 2'}}>
          <div className="card-head"><div className="card-title">Aggiungi test di riabilitazione / valutazione</div></div>
          <form onSubmit={handleAdd} style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:16}}>
            <input placeholder="Nome test (es. Forza quadricipite)" value={testName} onChange={e=>setTestName(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'9px 12px', borderRadius:7, fontSize:13.5, gridColumn:'1 / 4'}}/>
            <input placeholder="Valore" value={value} onChange={e=>setValue(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'9px 12px', borderRadius:7, fontSize:13.5}}/>
            <input placeholder="Unità (es. kg, °)" value={unit} onChange={e=>setUnit(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'9px 12px', borderRadius:7, fontSize:13.5}}/>
            <input type="date" value={testDate} onChange={e=>setTestDate(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'9px 12px', borderRadius:7, fontSize:13.5}}/>
            <input placeholder="Note (opzionale)" value={notes} onChange={e=>setNotes(e.target.value)}
              style={{background:'var(--pitch-100)', border:'1px solid var(--line)', color:'var(--text-hi)', padding:'9px 12px', borderRadius:7, fontSize:13.5, gridColumn:'1 / 4'}}/>
            <button type="submit" className="pill-btn on" style={{gridColumn:'1 / 4', cursor:'pointer'}}>Aggiungi test</button>
          </form>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Test registrati</div></div>
        {tests === null ? <div className="empty-hint">Caricamento…</div> :
         tests.length === 0 ? <div className="empty-hint">Nessun test registrato ancora.</div> :
         <div style={{display:'flex', flexDirection:'column', gap:12}}>
           {tests.map(t => (
             <div key={t.id} className="card" style={{background:'var(--pitch-100)'}}>
               <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                 <div>
                   <div style={{fontSize:15, fontWeight:600}}>{t.test_name}</div>
                   <div className="num" style={{fontSize:14, marginTop:2}}>{t.value} {t.unit}</div>
                   {t.notes && <div style={{color:'var(--text-lo)', fontSize:12.5, marginTop:4}}>{t.notes}</div>}
                   <div style={{color:'var(--text-lo)', fontSize:11.5, marginTop:4}}>{t.test_date ? new Date(t.test_date).toLocaleDateString('it-IT') : ''}</div>
                 </div>
                 <button onClick={()=>handleDelete(t.id)} style={{background:'transparent', border:'none', color:'var(--red)', fontSize:12, cursor:'pointer'}}>Elimina</button>
               </div>
               <button onClick={()=>handleConsultoIA(t)} disabled={generating===t.id} className="pill-btn" style={{marginTop:10, cursor:'pointer'}}>
                 {generating===t.id ? 'Generazione…' : t.ai_comment ? (revealed[t.id] ? 'Nascondi consulto IA' : 'Consulto IA') : 'Consulto IA'}
               </button>
               {t.ai_comment && revealed[t.id] && (
                 <div className="section-note" style={{marginTop:10, padding:10, background:'var(--pitch-200)', borderRadius:7}}>
                   <b style={{color:'var(--lime)'}}>Consulto IA:</b> {t.ai_comment}
                 </div>
               )}
             </div>
           ))}
         </div>
        }
      </div>
    </div>
  );
}

function PerformancePage(){
  const [scope, setScope] = useState('squadra');
  const [squadTab, setSquadTab] = useState('andamento');

  // --- dati squadra (caricati una volta, usati da tutti i sotto-tab squadra) ---
  const [teamSessions, setTeamSessions] = useState(null);
  const [teamError, setTeamError] = useState(null);
  const [selectedPlayers, setSelectedPlayers] = useState([]);
  const [metric, setMetric] = useState('distance');
  const [sortDir, setSortDir] = useState('desc');
  const [sessionIdx, setSessionIdx] = useState(null);
  const [compareBase, setCompareBase] = useState('session');
  const [dayA, setDayA] = useState(null);
  const [dayB, setDayB] = useState(null);

  React.useEffect(() => {
    if(scope !== 'squadra' || teamSessions !== null) return;
    loadTeamSessions().then(data => {
      setTeamSessions(data);
      const allNames = Array.from(new Set(data.flatMap(s => Object.keys(s.players))));
      setSelectedPlayers(allNames.slice(0, 8));
      setSessionIdx(data.length - 1);
      setDayA(Math.max(0, data.length-8));
      setDayB(data.length-1);
    }).catch(e=>setTeamError(e.message));
  }, [scope]);

  // --- dati giocatore singolo ---
  const [players, setPlayers] = useState(null);
  const [selectedName, setSelectedName] = useState('');
  const [playerTab, setPlayerTab] = useState('panoramica');
  const [sessions, setSessions] = useState(null);
  const [playerError, setPlayerError] = useState(null);

  React.useEffect(() => {
    if(scope !== 'giocatore' || players !== null) return;
    loadPlayers().then(list => {
      setPlayers(list);
      if(list.length) setSelectedName(list[0].PlayerName);
    }).catch(e=>setPlayerError(e.message));
  }, [scope]);

  React.useEffect(() => {
    if(!selectedName) return;
    setSessions(null);
    loadPlayerSessions(selectedName.toLowerCase()).then(setSessions).catch(e=>setPlayerError(e.message));
  }, [selectedName]);

  const m = TEAM_METRICS[metric];

  return (
    <div>
      <div className="topbar">
        <div>
          <h1 className="page-title">Area Performance</h1>
          <div className="page-sub">Dati GPS K-Sport — vista squadra o singolo giocatore</div>
        </div>
        <ScopeToggle scope={scope} setScope={setScope}/>
      </div>

      {scope === 'squadra' ? (
        teamError ? <ErrorState message={teamError}/> :
        teamSessions === null ? <LoadingState/> :
        teamSessions.length === 0 ? <div className="empty-hint">Nessuna sessione trovata.</div> :
        (
          <div>
            <div className="chip-row" style={{marginBottom:16}}>
              <button className={"chip" + (squadTab==='andamento'?' on':'')} onClick={()=>setSquadTab('andamento')}>Andamento</button>
              <button className={"chip" + (squadTab==='report'?' on':'')} onClick={()=>setSquadTab('report')}>Report sessione</button>
              <button className={"chip" + (squadTab==='ranking'?' on':'')} onClick={()=>setSquadTab('ranking')}>Classifica</button>
              <button className={"chip" + (squadTab==='giorni'?' on':'')} onClick={()=>setSquadTab('giorni')}>Confronto giorni</button>
            </div>

            {squadTab === 'andamento' && <SquadTimelineView teamSessions={teamSessions}/>}
            {squadTab === 'report' && <SessionReportView/>}

            {squadTab === 'ranking' && (
              <React.Fragment>
                <div className="chip-row" style={{marginBottom:18}}>
                  {Array.from(new Set(teamSessions.flatMap(s => Object.keys(s.players)))).sort().map(name => (
                    <button key={name} className={"chip" + (selectedPlayers.includes(name) ? " on":"")}
                      onClick={()=>setSelectedPlayers(sel => sel.includes(name) ? sel.filter(x=>x!==name) : [...sel, name])}>{name}</button>
                  ))}
                </div>
                {selectedPlayers.length === 0 ? <div className="empty-hint">Seleziona almeno un giocatore.</div> : (
                  <ConfrontiAtletiView teamSessions={teamSessions} selectedPlayers={selectedPlayers} metric={metric} setMetric={setMetric}
                    sortDir={sortDir} setSortDir={setSortDir} sessionIdx={sessionIdx} setSessionIdx={setSessionIdx}
                    compareBase={compareBase} setCompareBase={setCompareBase} m={m}/>
                )}
              </React.Fragment>
            )}

            {squadTab === 'giorni' && (
              <React.Fragment>
                <div className="chip-row" style={{marginBottom:18}}>
                  {Array.from(new Set(teamSessions.flatMap(s => Object.keys(s.players)))).sort().map(name => (
                    <button key={name} className={"chip" + (selectedPlayers.includes(name) ? " on":"")}
                      onClick={()=>setSelectedPlayers(sel => sel.includes(name) ? sel.filter(x=>x!==name) : [...sel, name])}>{name}</button>
                  ))}
                </div>
                {selectedPlayers.length === 0 ? <div className="empty-hint">Seleziona almeno un giocatore.</div> : (
                  <ConfrontiGiorniView teamSessions={teamSessions} selectedPlayers={selectedPlayers} metric={metric} setMetric={setMetric}
                    dayA={dayA} setDayA={setDayA} dayB={dayB} setDayB={setDayB} m={m}/>
                )}
              </React.Fragment>
            )}
          </div>
        )
      ) : (
        playerError ? <ErrorState message={playerError}/> :
        players === null ? <LoadingState/> :
        (
          <div>
            <div style={{display:'flex', alignItems:'center', gap:14, marginBottom:16}}>
              <PlayerAvatar playerName={selectedName} size={56}/>
              <div>
                <div style={{fontSize:20, fontFamily:"'Barlow Condensed'", fontWeight:700}}>{selectedName}</div>
                <PlayerPhotoUpload playerName={selectedName} onUploaded={()=>{}}/>
              </div>
            </div>
            <div className="controls" style={{marginBottom:16}}>
              <select value={selectedName} onChange={e=>setSelectedName(e.target.value)}>
                {players.map(p => <option key={p.PlayerId} value={p.PlayerName}>{p.PlayerName}</option>)}
              </select>
              {sessions && <ExportButtons playerName={selectedName} sessions={sessions}/>}
            </div>
            <div className="chip-row" style={{marginBottom:20}}>
              {[{id:'panoramica',label:'Panoramica'},{id:'carico',label:'Gestione Carico'},{id:'storico',label:'Storico Parametri'},{id:'unoauno',label:'1 vs 1'}].map(t => (
                <button key={t.id} className={"chip" + (playerTab===t.id?" on":"")} onClick={()=>setPlayerTab(t.id)}>{t.label}</button>
              ))}
            </div>
            {playerTab === 'unoauno' ? <UnoAUnoView/> :
             sessions === null ? <LoadingState/> :
             playerTab==='panoramica' ? <PanoramicaTab sessions={sessions}/> :
             playerTab==='carico' ? <CaricoTab sessions={sessions}/> :
             <StoricoTab sessions={sessions}/>
            }
          </div>
        )
      )}
    </div>
  );
}

  distance: {label:'Distanza', unit:'m', dec:0},
  eee: {label:'Spesa energetica (EEE)', unit:'kJ/kg', dec:1},
  maxSpeedKmh: {label:'Velocità massima', unit:'km/h', dec:1},
  distPerMin: {label:'Distanza/min', unit:'m/min', dec:1},
  pctHi: {label:'% alta velocità', unit:'%', dec:1},
  hiDistance: {label:'Distanza alta velocità', unit:'m', dec:0},
  accHiDistance: {label:'Distanza acc. alta intensità', unit:'m', dec:0},
  decHiDistance: {label:'Distanza dec. alta intensità', unit:'m', dec:0},
};

function pctBadgeClass(pct){
  if(pct >= 110) return 'badge-ok';
  if(pct >= 90) return 'badge-warn';
  return 'badge-danger';
}

function ConfrontiPage(){
  const [teamSessions, setTeamSessions] = useState(null);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState('atleti'); // 'atleti' | 'giorni'
  const [selectedPlayers, setSelectedPlayers] = useState([]);
  const [metric, setMetric] = useState('distance');
  const [sortDir, setSortDir] = useState('desc');
  const [sessionIdx, setSessionIdx] = useState(null);
  const [compareBase, setCompareBase] = useState('session');
  const [dayA, setDayA] = useState(null);
  const [dayB, setDayB] = useState(null);

  React.useEffect(() => {
    loadTeamSessions()
      .then(data => {
        setTeamSessions(data);
        const allNames = Array.from(new Set(data.flatMap(s => Object.keys(s.players))));
        setSelectedPlayers(allNames.slice(0, 8));
        setSessionIdx(data.length - 1);
        setDayA(Math.max(0, data.length-8));
        setDayB(data.length-1);
      })
      .catch(e => setError(e.message));
  }, []);

  if(error) return <ErrorState message={error}/>;
  if(teamSessions === null) return <LoadingState/>;
  if(teamSessions.length === 0) return <div className="empty-hint">Nessuna sessione di squadra trovata.</div>;

  const allPlayerNames = Array.from(new Set(teamSessions.flatMap(s => Object.keys(s.players)))).sort();
  const m = TEAM_METRICS[metric];

  const togglePlayer = (name) => {
    setSelectedPlayers(sel => sel.includes(name) ? sel.filter(x=>x!==name) : [...sel, name]);
  };

  return (
    <div>
      <div className="topbar">
        <div>
          <h1 className="page-title">Confronti</h1>
          <div className="page-sub">Atleti contro atleti, sessioni nel tempo, o un confronto 1 vs 1 dettagliato</div>
        </div>
        <div className="controls">
          <button className={"pill-btn" + (mode==='atleti'?' on':'')} onClick={()=>setMode('atleti')} style={{cursor:'pointer'}}>Tra atleti</button>
          <button className={"pill-btn" + (mode==='giorni'?' on':'')} onClick={()=>setMode('giorni')} style={{cursor:'pointer'}}>Tra giorni</button>
          <button className={"pill-btn" + (mode==='unoauno'?' on':'')} onClick={()=>setMode('unoauno')} style={{cursor:'pointer'}}>1 vs 1 dettagliato</button>
          <button className={"pill-btn" + (mode==='report'?' on':'')} onClick={()=>setMode('report')} style={{cursor:'pointer'}}>Report sessione</button>
        </div>
      </div>

      {mode === 'unoauno' ? <UnoAUnoView/> :
       mode === 'report' ? <SessionReportView/> : (
        <React.Fragment>
          <div className="chip-row" style={{marginBottom:18}}>
            {allPlayerNames.map(name => (
              <button key={name} className={"chip" + (selectedPlayers.includes(name) ? " on":"")} onClick={()=>togglePlayer(name)}>
                {name}
              </button>
            ))}
          </div>

          {selectedPlayers.length === 0 ? <div className="empty-hint">Seleziona almeno un giocatore.</div> :
           mode === 'atleti' ? (
            <ConfrontiAtletiView teamSessions={teamSessions} selectedPlayers={selectedPlayers} metric={metric} setMetric={setMetric}
              sortDir={sortDir} setSortDir={setSortDir} sessionIdx={sessionIdx} setSessionIdx={setSessionIdx}
              compareBase={compareBase} setCompareBase={setCompareBase} m={m}/>
           ) : (
            <ConfrontiGiorniView teamSessions={teamSessions} selectedPlayers={selectedPlayers} metric={metric} setMetric={setMetric}
              dayA={dayA} setDayA={setDayA} dayB={dayB} setDayB={setDayB} m={m}/>
           )
          }
        </React.Fragment>
      )}
    </div>

function averageRawParams(sessionsSubset){
  const keys = new Set();
  sessionsSubset.forEach(s => Object.keys(s.raw).forEach(k=>keys.add(k)));
  const avg = {};
  keys.forEach(k => {
    const vals = sessionsSubset.map(s => s.raw[k]).filter(v => typeof v === 'number');
    avg[k] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  });
  return avg;
}

function formatDurationHMS(totalSeconds){
  const s = Math.round(totalSeconds||0);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return [h,m,sec].map(x=>String(x).padStart(2,'0')).join(':');
}

/* Media e deviazione standard di ogni metrica, calcolate sullo storico
   combinato dei due giocatori selezionati — usate come riferimento per lo z-score. */
function computeZStats(sessions1, sessions2, metricKeys){
  const combined = [...(sessions1||[]), ...(sessions2||[])];
  const stats = {};
  metricKeys.forEach(k => {
    const vals = combined.map(s=>s.raw[k]).filter(v=>typeof v==='number');
    const mean = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    const variance = vals.length ? vals.reduce((a,b)=>a+Math.pow(b-mean,2),0)/vals.length : 0;
    stats[k] = { mean, std: Math.sqrt(variance) };
  });
  return stats;
}
function zScore(value, stat){
  if(!stat || !stat.std) return 0;
  return (value - stat.mean) / stat.std;
}

function UnoAUnoView(){
  const [players, setPlayers] = useState(null);
  const [error, setError] = useState(null);

  const [name1, setName1] = useState('');
  const [mode1, setMode1] = useState('avg-training');
  const [sessions1, setSessions1] = useState(null);

  const [name2, setName2] = useState('');
  const [mode2, setMode2] = useState('avg-training');
  const [sessions2, setSessions2] = useState(null);

  const [radarMetrics, setRadarMetrics] = useState(DEFAULT_RADAR_METRICS);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  React.useEffect(() => { loadPlayers().then(setPlayers).catch(e=>setError(e.message)); }, []);
  React.useEffect(() => { if(name1) loadPlayerSessions(name1.toLowerCase()).then(setSessions1).catch(e=>setError(e.message)); }, [name1]);
  React.useEffect(() => { if(name2) loadPlayerSessions(name2.toLowerCase()).then(setSessions2).catch(e=>setError(e.message)); }, [name2]);

  const resolveParams = (sessions, mode) => {
    if(!sessions) return null;
    if(mode === 'avg-training') return averageRawParams(sessions.filter(s=>!s.isMatch));
    if(mode === 'avg-match') return averageRawParams(sessions.filter(s=>s.isMatch));
    if(mode.startsWith('session:')){
      const id = Number(mode.split(':')[1]);
      const s = sessions.find(x=>x.sessionId===id);
      return s ? s.raw : null;
    }
    return null;
  };

  const handleConfronta = () => {
    setLoading(true);
    const p1 = resolveParams(sessions1, mode1);
    const p2 = resolveParams(sessions2, mode2);
    setResult({ p1, p2 });
    setLoading(false);
  };

  const toggleRadarMetric = (key) => {
    setRadarMetrics(sel => sel.includes(key) ? sel.filter(x=>x!==key) : [...sel, key]);
  };

  if(error) return <ErrorState message={error}/>;
  if(players === null) return <LoadingState/>;

  const zStats = result ? computeZStats(sessions1, sessions2, radarMetrics) : {};

  return (
    <div style={{display:'grid', gridTemplateColumns:'240px 1fr 300px', gap:14, alignItems:'start'}}>
      <div className="card">
        <PlayerPickerColumn label="Giocatore 1" players={players} playerName={name1} setPlayerName={setName1} mode={mode1} setMode={setMode1} sessions={sessions1}/>
        <PlayerPickerColumn label="Giocatore 2" players={players} playerName={name2} setPlayerName={setName2} mode={mode2} setMode={setMode2} sessions={sessions2}/>

        <div className="card-title" style={{marginBottom:6}}>Parametri nel radar (z-score)</div>
        <div style={{display:'flex', flexWrap:'wrap', gap:5, marginBottom:14}}>
          {RADAR_CANDIDATES.map(k => (
            <button key={k} onClick={()=>toggleRadarMetric(k)}
              style={{
                fontSize:10.5, padding:'4px 8px', borderRadius:14, cursor:'pointer',
                border:'1px solid var(--line)',
                background: radarMetrics.includes(k) ? 'var(--pitch-200)' : 'var(--pitch-100)',
                color: radarMetrics.includes(k) ? 'var(--lime)' : 'var(--text-lo)',
              }}>{k}</button>
          ))}
        </div>

        <button onClick={handleConfronta} disabled={!name1 || !name2 || loading} className="pill-btn on" style={{width:'100%', cursor:'pointer'}}>
          {loading ? 'Confronto…' : 'Confronta'}
        </button>
      </div>

      {!result ? <div className="empty-hint" style={{gridColumn:'span 2'}}>Scegli due giocatori e clicca "Confronta".</div> : !result.p1 || !result.p2 ? (
        <div className="empty-hint" style={{gridColumn:'span 2'}}>Dati insufficienti per uno dei due giocatori nella modalità scelta.</div>
      ) : (
        <React.Fragment>
          <div>
            <div className="card" style={{marginBottom:14}}>
              <div className="card-head"><div className="card-title">Performance (z-score)</div></div>
              {radarMetrics.length < 3 ? <div className="empty-hint">Seleziona almeno 3 parametri per il radar.</div> : (() => {
                const radarPoints = radarMetrics.map(k => ({
                  metric: k,
                  p1: zScore(result.p1[k]||0, zStats[k]),
                  p2: zScore(result.p2[k]||0, zStats[k]),
                }));
                // Zoom automatico: la scala si adatta al massimo scostamento reale,
                // invece di usare sempre un range fisso -3/+3 (che rimpicciolisce
                // troppo la figura quando gli scostamenti sono piccoli).
                const maxAbs = Math.max(1, ...radarPoints.flatMap(p => [Math.abs(p.p1), Math.abs(p.p2)]));
                const domain = maxAbs * 1.15;
                return (
                  <React.Fragment>
                    <RadarChart
                      height={400} domainMin={-domain} domainMax={domain}
                      data={radarPoints}
                      metricKey="metric"
                      series={[{key:'p1', name:name1, color:'#4FD3B8'}, {key:'p2', name:name2, color:'#E8D53D'}]}
                    />
                    <ChartLegend series={[{key:'p1', name:name1, color:'#4FD3B8'}, {key:'p2', name:name2, color:'#E8D53D'}]}/>
                    <div className="section-note">Z-score calcolato sullo storico combinato dei due giocatori: 0 = media, ogni unità = una deviazione standard. Scala adattata automaticamente ai valori mostrati.</div>
                  </React.Fragment>
                );
              })()}
            </div>

            <div className="card">
              <div className="card-head"><div className="card-title">Alta intensità</div></div>
              <BarChart2
                height={170}
                data={HI_BAR_METRICS.map(bm => ({label: bm.label, A: +(result.p1[bm.key]||0).toFixed(2), B: +(result.p2[bm.key]||0).toFixed(2)}))}
                xKey="label" series={[{key:'A', name:name1, color:'#4FD3B8'}, {key:'B', name:name2, color:'#E8D53D'}]}
              />
              <ChartLegend series={[{key:'A', name:name1, color:'#4FD3B8'}, {key:'B', name:name2, color:'#E8D53D'}]}/>
            </div>
          </div>

          <div className="card">
            <div style={{display:'grid', gridTemplateColumns:'62px 1fr 62px', gap:6, textAlign:'center', marginBottom:10}}>
              <div style={{fontWeight:700, fontSize:12.5, textAlign:'right'}}>{name1}</div>
              <div></div>
              <div style={{fontWeight:700, fontSize:12.5, textAlign:'left'}}>{name2}</div>
            </div>
            <div className="card-title" style={{marginBottom:4}}>Total Load</div>
            {TOTAL_LOAD_ROWS.map(r => (
              <StatRow key={r.key} v1={fmt(result.p1[r.key]||0, r.dec)} label={r.label} v2={fmt(result.p2[r.key]||0, r.dec)}/>
            ))}
            <StatRow v1={formatDurationHMS(result.p1.T)} label="T" v2={formatDurationHMS(result.p2.T)}/>

            <div className="card-title" style={{margin:'14px 0 4px'}}>High Intensity</div>
            {HIGH_INTENSITY_ROWS.map(r => (
              <StatRow key={r.key} v1={fmt(result.p1[r.key]||0, r.dec)} label={r.label} v2={fmt(result.p2[r.key]||0, r.dec)}/>
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

const SORT_MODE_LABELS = { asc:'crescente ▲', desc:'decrescente ▼', peak:'più vicino al picco ★' };

function SortableMetricChart({title, unit, color, rows, sortMode, onCycle}){
  let sorted;
  if(sortMode === 'peak'){
    sorted = rows.slice().sort((a,b) => b.pctPeak - a.pctPeak);
  } else if(sortMode === 'desc'){
    sorted = rows.slice().sort((a,b) => b.value - a.value);
  } else {
    sorted = rows.slice().sort((a,b) => a.value - b.value);
  }
  const avg = rows.length ? rows.reduce((a,r)=>a+r.value,0)/rows.length : 0;
  const chartData = sorted.map(r => ({label:r.name, value:+r.value.toFixed(2)}));

  return (
    <div className="card" style={{marginBottom:14}}>
      <div className="card-head" style={{cursor:'pointer'}} onClick={onCycle}>
        <div className="card-title">{title}</div>
        <span style={{fontSize:11, color:'var(--lime)'}}>{SORT_MODE_LABELS[sortMode]} — clic per cambiare</span>
      </div>
      <BarChart2 data={chartData} xKey="label" unit={unit}
        series={[{key:'value', name:title, color}]}
        refLine={{value:avg, label:'Media squadra', color:'#E8A33D'}}/>
    </div>
  );
}

function SessionReportView(){
  const [teamSessions, setTeamSessions] = useState(null);
